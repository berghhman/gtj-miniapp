<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0d0e10">
<link rel="icon" href="img/gtj-wordmark.svg" type="image/svg+xml">
<title>GTJ Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column (Telegram webview) — sticky top, scrolling feed, bottom tab bar; on desktop it sits in a frame next to a short brief. */
:root{
  --ink:#0d0e10;        /* app ground: graphite with a cold bias */
  --panel:#16181b;      /* raised surfaces */
  --panel-2:#1e2125;    /* inputs, pressed */
  --line:#272a2f;       /* hairlines */
  --fg:#efebe2;         /* warm off-white text */
  --muted:#8b9097;
  --cream:#ece5d3;      /* primary actions */
  --red:#e0262f;        /* the plate's red line — counts, sale, alerts only */
  --ok:#7fd1a0;
  --warn:#f0b65a;
  --tile:#ecebe7;       /* studio backdrop for product cut-outs */
  --backdrop:#08090a;
  --f-display:"Tektur","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
[hidden]{display:none!important}
/* behave like an app, not a page: no zoom, no page bounce, no text selection or long-press menus */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img,svg{-webkit-user-drag:none;user-select:none}
body{position:fixed;inset:0;margin:0;background:var(--backdrop);color:var(--fg);font:500 14px/1.45 var(--f-body);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 6px,transparent 6px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.018) 0 6px,transparent 6px 12px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--cream);outline-offset:2px;border-radius:8px}
img{display:block;max-width:100%}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.filled{fill:currentColor}
.ico.i14{width:14px;height:14px;vertical-align:-2px}

/* ---------- stage ---------- */
.stage{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:56px}
.brief{display:none}
.app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--ink);overflow:hidden}
@media (min-width:640px){
  .stage{padding:24px}
  .app{height:min(900px,100%);border-radius:36px;border:1px solid #2c3036;box-shadow:0 0 0 8px #050506,0 0 0 9px #26292e,0 40px 80px rgba(0,0,0,.6)}
}
@media (min-width:1000px){
  .brief{display:flex;flex-direction:column;gap:22px;width:330px}
  .brief img{width:200px}
  .brief h1{font:700 28px/1.15 var(--f-display);margin:0;text-wrap:balance}
  .brief p{margin:0;color:var(--muted);max-width:34ch}
  .brief nav{display:flex;flex-direction:column;gap:6px}
  .brief nav button{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:left;font-weight:600}
  .brief nav button:hover{border-color:#3a3e44}
  .brief nav button span{color:var(--muted)}
}

/* ---------- telegram chrome (only outside Telegram) ---------- */
.tgbar{flex:none;display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 14px;background:#121315;border-bottom:1px solid var(--line);font-size:14px}
.tgbar b{font-weight:700;display:block;text-align:center;line-height:1.1}
.tgbar small{display:block;text-align:center;color:var(--muted);font-size:11px}
.tgbar .tgx{color:#6ab3f3;font-weight:600;min-width:64px}
.tgbar .tgm{min-width:64px;text-align:right;color:var(--muted);font-size:20px;line-height:1}

/* ---------- view ---------- */
.vp{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--ink)}
main{position:relative;z-index:1;height:100%;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--ink);box-shadow:-14px 0 28px rgba(0,0,0,.45)}
main::-webkit-scrollbar{width:0}
main.snap{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
/* compact bar that takes over the title once the big one scrolls away */
.navbar{position:absolute;top:0;left:0;right:0;z-index:4;height:48px;display:flex;align-items:center;justify-content:center;padding:0 64px;background:rgba(13,14,16,.95);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 1px 0 var(--line);font:600 16px/1 var(--f-display);opacity:0;transform:translateY(-8px);transition:opacity .18s,transform .18s;pointer-events:none}
.navbar b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp.far .navbar.on{opacity:1;transform:none}

/* press feedback instead of hover: everything tappable gives way under the finger */
.cat,.btn,.chip,.mycar,.row-card,.mrow,.brand,.modrow,.iconbtn,.addbtn,.favbtn,.work,.gadd,.day,.seg button,.story,.hero,.club,.card,.gcar,.tab,.search,.stepper button,.sv-cap .btn{transition:transform .14s cubic-bezier(.2,.8,.2,1),filter .14s,background-color .14s}
:is(.cat,.btn,.chip,.mycar,.row-card,.mrow,.brand,.modrow,.iconbtn,.addbtn,.favbtn,.gadd,.day,.seg button,.search):active{transform:scale(.96)}
.card:has(.media:active,.name:active),.work:active,.club:active,.hero:has(.btn:active){transform:scale(.975)}
.story:active{transform:scale(.92)}
.tab:active{transform:scale(.9)}
.stepper button:active{transform:scale(.85)}
:is(.menu>*,.order>button,.citem .inst):active{background:var(--panel-2)}
.btn-cream:active{filter:brightness(.9)}
/* bigger hit areas for small controls */
.addbtn,.stepper button{position:relative}
:is(.favbtn,.addbtn,.iconbtn,.stepper button)::after{content:"";position:absolute;inset:-6px}
/* images fade in over a shimmer instead of popping in */
:is(.media,.work,.mycar .ph,.gcar .ph,.mrow .ph,.hero,.story .ring,.pp>.media) img{opacity:0;transition:opacity .3s}
img.ld{opacity:1!important}
:is(.media,.mycar .ph,.gcar .ph,.mrow .ph,.work):has(>img:not(.ld)){background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);background-size:220% 100%;animation:shimmer 1.2s linear infinite}
.media:has(>img:not(.ld)){background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%)}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{margin:0;font:600 18px/1.2 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.sec-h button{display:inline-flex;align-items:center;gap:1px;min-height:32px;margin:-6px -4px -6px 0;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.sec-h button .ico{width:16px;height:16px;stroke-width:2.2}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted)}
.hint.ok{color:var(--ok)}
.hint.err{color:var(--warn)}

/* header */
.top{position:sticky;top:0;z-index:5;margin:0 -16px;padding:12px 16px;background:linear-gradient(var(--ink) 75%,rgba(13,14,16,0));display:flex;flex-direction:column;gap:12px;transition:background-color .2s,box-shadow .2s}
.vp.scrolled .top{background:rgba(13,14,16,.9);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 1px 0 var(--line)}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow img{width:74px;height:auto}
.brandrow .t{flex:1;min-width:0}
.brandrow .t b{display:block;font:700 16px/1.1 var(--f-display);letter-spacing:.04em}
.brandrow .t span{font-size:12px;color:var(--muted)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.iconbtn.glass{background:rgba(13,14,16,.72);backdrop-filter:blur(6px);border-color:rgba(255,255,255,.08)}
.dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font:700 10px/16px var(--f-body);text-align:center}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font-size:16px}
button.search{width:100%;text-align:left;font-size:14px}
.search input::placeholder{color:var(--muted)}

/* my car */
.mycar{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.mycar .ph{width:76px;height:52px;border-radius:9px;flex:none;overflow:hidden;background:var(--panel-2);display:grid;place-items:center;color:var(--muted)}
.mycar .ph img{width:100%;height:100%;object-fit:cover}
.mycar .t{flex:1;min-width:0}
.mycar b{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mycar span{font-size:12px;color:var(--muted)}
.mycar.empty{border-style:dashed;border-color:#3a3e44}

/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line);margin-top:12px}
.hero img{width:100%;aspect-ratio:835/265;object-fit:cover}
.hero .copy{padding:10px 16px 16px;display:flex;flex-direction:column;gap:8px}
.hero h3{margin:0;font:700 32px/1 var(--f-display);letter-spacing:.01em;background:linear-gradient(180deg,#fff 0%,#c9ced5 45%,#737a83 62%,#e6e9ec 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:#c3c0b8;max-width:36ch}
.hero .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px;flex-wrap:wrap}
.hero .tag{position:absolute;top:12px;left:12px;padding:5px 9px;border-radius:7px;background:var(--red);color:#fff;font:700 11px/1 var(--f-body);letter-spacing:.08em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;white-space:nowrap;text-decoration:none}
.btn-cream{background:var(--cream);color:#121214}
.btn-cream:active{filter:brightness(.92)}
.btn-ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--fg)}
.btn-sm{height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn-block{width:100%}

/* categories */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:11px;font-weight:600;line-height:1.15;text-align:center;min-height:88px}
.cat .ico{width:28px;height:28px;stroke-width:1.5;color:var(--cream)}
.cat small{color:var(--muted);font-weight:500;font-size:10.5px}

/* product cards */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll,.chips{scroll-padding-inline:16px}
.hscroll>*{scroll-snap-align:start;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden;text-align:left}
.hscroll .card{width:168px}
.media{position:relative;display:block;width:100%;aspect-ratio:1/1;background:var(--tile);overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover}
.media.contain img{object-fit:contain;padding:8%}
.media .badge{position:absolute;top:8px;left:8px}
.badge{display:inline-block;padding:4px 7px;border-radius:6px;font:700 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:#111;color:var(--cream)}
.badge.red{background:var(--red);color:#fff}
.favbtn{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(13,14,16,.55);color:#fff;backdrop-filter:blur(6px)}
.favbtn.on{color:var(--red)}
.favbtn.on .ico{fill:currentColor}
.favbtn .ico{width:18px;height:18px}
.card .info{display:flex;flex-direction:column;gap:4px;padding:10px 10px 12px;flex:1}
.fits{font-size:11px;font-weight:600;color:var(--ok);display:flex;align-items:center;gap:4px;min-width:0}
.fits span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fits.no{color:var(--muted)}
.fits.uni{color:var(--muted)}
.fits .ico{width:13px;height:13px;stroke-width:2.4}
.card .name{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;text-align:left}
.card .pr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.price{font:600 16px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.old{font-size:12px;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.addbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--cream);color:#121214;flex:none}
.addbtn.in{background:var(--panel-2);color:var(--cream);border:1px solid #3a3e44}
.addbtn .ico{width:18px;height:18px;stroke-width:2.2}

/* tile for items without a photo */
.svc{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:34px 12px 12px;color:var(--fg);
  background:radial-gradient(120% 90% at 100% 0%,rgba(224,38,47,.24),transparent 55%),repeating-linear-gradient(45deg,#17191c 0 5px,#1d2024 5px 10px)}
.svc .k{font:700 20px/1 var(--f-display);letter-spacing:.03em}
.svc .v{font:700 28px/1 var(--f-display);color:var(--cream)}
.svc .s{font-size:11px;color:var(--muted)}
.svc .gl{width:46%;height:auto;aspect-ratio:1;color:var(--cream);stroke-width:1.1;align-self:flex-end;opacity:.9}
.svc .cap{font-size:10.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:700}

/* works */
.work{width:220px;border-radius:var(--r);overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.work img{width:100%;aspect-ratio:4/3;object-fit:cover}
.work div{padding:9px 11px 11px}
.work b{display:block;font-size:13px}
.work span{font-size:11.5px;color:var(--muted)}
/* stories */
.stories{gap:14px;padding-top:2px;padding-bottom:2px}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:66px;font-size:11.5px;font-weight:600;line-height:1.1;text-align:center}
.story .ring{width:64px;height:64px;border-radius:50%;padding:2.5px;background:conic-gradient(from 200deg,var(--red),#ff8a3d 35%,var(--cream) 60%,var(--red))}
.story .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--ink);background:var(--panel-2)}
.story.seen .ring{background:#3a3e44}
.story.seen>span:last-child{color:var(--muted)}
#story:empty{display:none}
.sv{position:absolute;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;animation:svin .26s cubic-bezier(.2,.8,.2,1)}
.sv.out{animation:svout .2s ease-in forwards}
.sv-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sv::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.5),transparent 22%,transparent 55%,rgba(0,0,0,.85));pointer-events:none}
.sv-bars{position:relative;z-index:2;display:flex;gap:4px;padding:10px 10px 0}
.sv-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sv-bars i b{display:block;height:100%;width:0;background:#fff}
.sv-bars i.done b{width:100%}
.sv-bars i b.run{animation:svfill 5s linear forwards}
.sv.paused .sv-bars i b.run{animation-play-state:paused}
.sv-head{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 6px 0 12px;color:#fff;font-size:13px}
.sv-head img{width:32px;height:32px;border-radius:50%;object-fit:cover;opacity:1}
.sv-head b{flex:1;font-weight:700}
.sv-head button{width:44px;height:44px;display:grid;place-items:center;color:#fff}
.sv-tap{position:absolute;top:70px;bottom:150px;z-index:1;width:35%}
.sv-tap.l{left:0}.sv-tap.r{right:0;width:65%}
.sv-cap{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;gap:6px;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));color:#fff}
.sv-cap b{font:700 24px/1.1 var(--f-display);text-wrap:balance}
.sv-cap span{color:rgba(255,255,255,.8);font-size:14px}
.sv-cap .btn{margin-top:8px}
@keyframes svfill{to{width:100%}}
@keyframes svin{from{opacity:0;transform:scale(.92)}}
@keyframes svout{to{opacity:0;transform:scale(.94)}}
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.perk{padding:12px 10px;border-radius:12px;border:1px dashed #33373d;font-size:12px;line-height:1.3;color:var(--muted)}
.perk b{display:block;color:var(--fg);font:600 13px/1.2 var(--f-display);margin-bottom:4px}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--cream);color:#121214;border-color:var(--cream)}
.chip .ico{width:14px;height:14px;stroke-width:2.4}
.chip:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}
.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:34px;padding:0 10px}

/* product page */
.pp{margin:0 -16px}
.pnav{position:sticky;top:0;z-index:6;height:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px 0}
.pnav>*{position:relative;z-index:1}
.pnav .pbar{position:absolute;top:0;left:0;right:0;z-index:0;height:64px;display:flex;align-items:center;padding:0 112px 0 68px;background:rgba(13,14,16,.9);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 1px 0 var(--line);font:600 15px/1.2 var(--f-display);opacity:0;transition:opacity .18s;pointer-events:none}
.pnav .pbar b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp.far .pnav .pbar{opacity:1}
.vp.far .iconbtn.glass{background:var(--panel);border-color:var(--line)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--tile)}
.gal::-webkit-scrollbar{display:none}
.gal .media{flex:none;width:100%;scroll-snap-align:center}
.gal .svc{padding-top:68px!important}
.gdots{display:flex;gap:5px;justify-content:center;margin-top:-22px;position:relative;z-index:1}
.gdots i{width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.25)}
.gdots i.on{width:18px;background:#121214}
.pbody{padding:16px;display:flex;flex-direction:column;gap:14px}
.pbody h1{margin:0;font:600 23px/1.15 var(--f-display);text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:12.5px}
.stock{color:var(--ok);font-weight:600}

  background:linear-gradient(115deg,#d9dde2 0%,#f7f8f9 22%,#a9afb7 46%,#e6e9ec 64%,#9aa0a8 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);text-align:left;width:100%}

.appt .t{display:flex;flex-direction:column;gap:3px;min-width:0}

.appt .t span{font-size:12.5px;color:var(--muted)}
.appt .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.order{border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden}

.menu .t small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.plate{display:inline-flex;align-items:stretch;height:26px;border:2px solid #111;border-radius:4px;background:#fff;color:#111;font:600 15px/22px var(--f-mono);overflow:hidden;align-self:flex-start}

/* car picker */
.brands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left;min-width:0}

.field input,.field textarea,.field select{font-size:16px}

.sheet .shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field textarea,.field select{height:46px;padding:0 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);outline:0}

.field input:focus,.field textarea:focus{border-color:#4a4f56}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}
.success .okc{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(127,209,160,.12);color:var(--ok)}

.success h2{font-size:22px}
.success p{margin:0;color:var(--muted);max-width:32ch}
.prose{display:flex;flex-direction:column;gap:12px;font-size:13.5px;color:#cbc7bf;line-height:1.55}
.prose h3{margin:6px 0 0;font:600 15px var(--f-display);color:var(--fg)}
.prose p{margin:0}
.note{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.note .ico{color:var(--cream)}
.note small{display:block;color:var(--muted)}
.toast{position:absolute;left:50%;bottom:150px;z-index:30;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:11px 16px;border-radius:12px;background:var(--cream);color:#121214;font-weight:700;font-size:13px;max-width:90%;text-align:center;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.4)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

/* ======================= data ======================= */
const IMG = 'img/';
const BOT = 'https://t.me/GTJdetailing_bot';
const CARS = window.GTJ_CARS, ENG = window.GTJ_ENGINES;
const CATS = window.GTJ_CATS, P = window.GTJ_PRODUCTS, CREDITS = window.GTJ_CREDITS;
const PM = Object.fromEntries(P.map(p => [p.id, p]));
const CATM = Object.fromEntries(CATS.map(c => [c.id, c]));
/* stories: work from the box, the way shops in apps show it (cover, title, frames with a call to action) */

const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CM = (t, w = 640) => 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(t) + '?width=' + w;
function resolveCar(g) {
  const b = CARS.find(x => x.id === g.b); if (!b) return null;
  const m = b.models.find(x => x.id === g.m); if (!m || !m.m[g.i]) return null;
  const d = m.m[g.i];
  return { b, m, d, eng: d[1], fuel: d[7], key: b.id + '/' + m.id, title: b.n + ' ' + m.n, short: m.n, spec: modSpec(d) };
}
function modSpec(d) { return `${d[0]} · ${d[2]} л.с. · ${d[4]} · ${d[5]}`; }
const car = () => S.garage[S.active] ? resolveCar(S.garage[S.active]) : null;
function fits(p, c = car()) {
  if (!c) return true;
  const f = p.fit;
  if (p.stage) return ENG[c.eng] && ENG[c.eng].s1 && ['p', 'd', 'hev'].includes(c.fuel) && (f === 'turbo' || (Array.isArray(f) && f.includes(c.eng)));
  if (f === 'all') return true;
  if (f === 'ice') return c.fuel !== 'ev';
  if (f === 'turbo') return !!(ENG[c.eng] && ENG[c.eng].turbo) && c.fuel !== 'ev';
  if (Array.isArray(f)) return f.includes(c.eng);
  if (f && f.models) return f.models.includes(c.key);
  return true;
}
const universal = p => p.fit === 'all';
function stageGain(p, c = car()) {
  if (!p.stage || !c) return null;
  const E = ENG[c.eng]; if (!E || !E.s1 || !fits(p, c)) return null;
  const s2 = E.s2 || E.s1;
  const t = p.stage === 1 ? E.s1 : p.stage === 2 ? s2 : [s2[0] + 45, s2[1] + 80];
  return { hp: t[0], nm: t[1], dhp: t[0] - c.d[2], dnm: t[1] - c.d[3] };
}
const unitPrice = (p, v) => { const vr = p.v && p.v.find(x => x.id === v); return vr && vr.p ? vr.p : p.p; };
const minPrice = p => p.v ? Math.min(...p.v.map(x => x.p || p.p)) : p.p;
function pimg(p, v) {

}

const isContain = p => ['dv.jpg', 'bov.jpg', 'coilovers.jpg', 'pedals.jpg', 'turbo.jpg', 'struts-red.jpg'].includes(p.img) || (p.cm && /\.png$/i.test(p.cm));

function slotDays() {
  const names = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб']; const out = []; const d = new Date();
  for (let i = 1; out.length < 6 && i < 10; i++) { const x = new Date(d); x.setDate(d.getDate() + i); if (x.getDay() === 0) continue; out.push({ key: x.toISOString().slice(0, 10), w: names[x.getDay()], n: x.getDate(), m: x.toLocaleString('ru-RU', { month: 'short' }).replace('.', '') }); }
  return out;
}
const TIMES = ['10:00', '12:00', '14:00', '16:00', '18:00'];
function totals() {
  let goods = 0, svc = 0, inst = 0;
  S.cart.forEach(i => { const p = PM[i.id]; const u = unitPrice(p, i.v) * i.qty; if (p.svc) svc += u; else goods += u; if (i.inst && p.inst) inst += p.inst * i.qty; });
  const promo = S.promoOk ? Math.round(goods * 0.10) : 0;
  const deliv = S.delivery === 'cdek' ? 450 : S.delivery === 'courier' ? 690 : 0;
  const pre = goods + svc + inst - promo + deliv;
  const maxBonus = Math.min(S.bonus, Math.floor(pre * 0.2));
  const bonus = S.useBonus ? maxBonus : 0;
  const total = Math.max(0, pre - bonus);
  return { goods, svc, inst, promo, deliv, bonus, maxBonus, total, earn: Math.round(total * 0.05) };
}

/* ======================= render ======================= */
const $ = s => document.querySelector(s);
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const TABS = { home: vHome, catalog: vCatalog, cart: vCart, profile: vProfile };
const TAB_TITLE = { home: '', catalog: '', cart: 'Корзина', profile: 'Кабинет' };
const SCROLL = {};          // each screen remembers where you left it, like tabs in a native app
let lastKey = '';
const keyNow = () => S.product ? 'p:' + S.product : S.carInfo ? 'car' : S.tab;
const isSub = k => k.startsWith('p:') || k === 'car';
const EASE = 'cubic-bezier(.2,.8,.2,1)';

function markLoaded(root) { root.querySelectorAll('img').forEach(i => { if (i.complete && i.naturalWidth) i.classList.add('ld'); }); }
function snapOf(html, scrollTop) {
  const s = document.createElement('main');
  s.className = 'snap'; s.setAttribute('aria-hidden', 'true'); s.inert = true;
  if (html instanceof Element) s.innerHTML = html.innerHTML; else s.innerHTML = html;
  s.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  $('#vp').appendChild(s); s.scrollTop = scrollTop || 0; markLoaded(s);
  return s;
}

function render(opt = {}) {
  const view = $('#view');
  const key = keyNow();
  const changed = key !== lastKey;
  let top = view.scrollTop;
  if (changed) { if (lastKey) SCROLL[lastKey] = view.scrollTop; top = isSub(key) ? 0 : (SCROLL[key] || 0); }
  if (render.reset) { top = 0; render.reset = false; }
  let dir = null;
  if (changed && lastKey && !opt.noAnim && !REDUCED) {
    if (isSub(key) && !isSub(lastKey)) dir = 'push';
    else if (!isSub(key) && isSub(lastKey)) dir = 'pop';
    else if (isSub(key) && isSub(lastKey)) dir = 'push';
  }
  const snap = dir ? snapOf(view, view.scrollTop) : null;
  view.innerHTML = S.product ? vProduct() : S.carInfo ? vCarInfo() : TABS[S.tab]();
  lastKey = key;

  const bottom = $('#bottom');
  if (S.product) {
    const p = PM[S.product]; const price = unitPrice(p, S.pv) * S.pqty + (S.pinst && p.inst ? p.inst * S.pqty : 0);
    const already = S.cart.some(i => i.id === p.id && i.v === S.pv);
    bottom.innerHTML = `<div class="actionbar">
      ${p.svc ? '' : `<div class="stepper"><button data-act="pqty" data-d="-1" aria-label="Меньше">${ic('minus')}</button><span>${S.pqty}</span><button data-act="pqty" data-d="1" aria-label="Больше">${ic('plus')}</button></div>`}
      ${already ? `<button class="btn btn-ghost" style="flex:1" data-act="tab" data-v="cart">${ic('check')}В корзине · перейти</button>` : `<button class="btn btn-cream" data-act="addp">${p.svc ? 'Записаться' : 'В корзину'} · <span class="num">${rub(price)}</span></button>`}
    </div>`;
  } else if (!S.carInfo && S.tab === 'cart' && S.cart.length) {
    bottom.innerHTML = `<div class="actionbar"><button class="btn btn-cream" data-act="checkout">Оформить заказ · <span class="num">${rub(totals().total)}</span></button></div>`;
  } else bottom.innerHTML = '';

  const sub = !!(S.product || S.carInfo);
  $('#tabbar').hidden = sub;
  const cc = cartCount();
  $('#tabbar').innerHTML = [['home', 'home', 'Главная'], ['catalog', 'grid', 'Каталог'], ['cart', 'cart', 'Корзина'], ['profile', 'user', 'Кабинет']]
    .map(([id, icn, l]) => `<button class="tab ${S.tab === id && !sub ? 'on' : ''}" data-act="tab" data-v="${id}" ${S.tab === id && !sub ? 'aria-current="page"' : ''}>${ic(icn)}${l}${id === 'cart' && cc ? `<span class="dot">${cc}</span>` : ''}</button>`).join('');

  view.scrollTop = top;
  markLoaded(view);
  const nav = $('#navbar'); const nt = sub ? '' : TAB_TITLE[S.tab];
  nav.classList.toggle('on', !!nt); $('#navtitle').textContent = nt;
  onScroll();
  if (snap) {
    const o = { duration: 340, easing: EASE };
    if (dir === 'push') {
      view.animate([{ transform: 'translateX(100%)' }, { transform: 'none' }], o);
      snap.animate([{ transform: 'none', filter: 'brightness(1)' }, { transform: 'translateX(-28%)', filter: 'brightness(.55)' }], { ...o, fill: 'forwards' }).onfinish = () => snap.remove();
    } else {
      snap.style.zIndex = 2;
      view.animate([{ transform: 'translateX(-28%)', filter: 'brightness(.55)' }, { transform: 'none', filter: 'brightness(1)' }], o);
      snap.animate([{ transform: 'none' }, { transform: 'translateX(100%)' }], { ...o, fill: 'forwards' }).onfinish = () => snap.remove();
    }
  }

  const gal = $('#gal');
  if (gal && $('#gdots')) gal.addEventListener('scroll', () => {
    const i = Math.round(gal.scrollLeft / gal.clientWidth);
    document.querySelectorAll('#gdots i').forEach((d, j) => d.classList.toggle('on', i === j));
  }, { passive: true });
  // broken remote photo → fall back to the tile
  view.querySelectorAll('img[referrerpolicy]').forEach(im => im.addEventListener('error', () => { const b = im.closest('.media'); const id = b && b.dataset.v; if (b && id && PM[id]) { b.classList.remove('contain'); b.innerHTML = tileHtml(PM[id]); } else im.remove(); }, { once: true }));

  syncBack();
  persist();
}

function onScroll() {
  const v = $('#view'), vp = $('#vp'); const st = v.scrollTop;
  vp.classList.toggle('scrolled', st > 2);
  const g = v.querySelector('#gal, .pp > .media');
  vp.classList.toggle('far', st > (g ? g.offsetHeight - 70 : 56));
}

/* Telegram's own Back button closes whatever is on top: story, sheet, then the pushed screen */
const sheetOpen = () => !!document.querySelector('#sheet .sheet:not(.closing)');
const storyOpen = () => !!document.querySelector('#story .sv:not(.out)');
function syncBack() {
  if (!tg) return;
  try { (S.product || S.carInfo || sheetOpen() || storyOpen()) ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}
function goBack(noAnim) {
  if (storyOpen()) return closeStory();
  if (sheetOpen()) return sheet('');
  if (S.product) S.product = null; else if (S.carInfo) S.carInfo = null; else return;
  render({ noAnim });
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000);
}

/* bottom sheet: slides up once, swaps content in place, slides down to close (also by dragging) */
let sheetFocus = null;
function sheet(html) {
  const host = $('#sheet');
  const cur = host.querySelector('.sheet:not(.closing)');
  if (!html) {
    if (!cur) return;
    cur.classList.add('closing');
    const p = cur.querySelector('.panel');
    if (REDUCED) cur.remove();
    else {
      const from = p.style.transform || 'none';
      p.animate([{ transform: from }, { transform: 'translateY(105%)' }], { duration: 240, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
      cur.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, fill: 'forwards' }).onfinish = () => cur.remove();
    }
    if (sheetFocus && document.contains(sheetFocus)) try { sheetFocus.focus({ preventScroll: true }); } catch (e) {}
    syncBack(); return;
  }
  if (cur) {
    const p = cur.querySelector('.panel');
    const sameTitle = (p.querySelector('h2') || {}).textContent === (/<h2>(.*?)<\/h2>/.exec(html) || [])[1];
    const st = p.scrollTop;
    p.innerHTML = `<div class="grab"></div>${html}`;
    p.scrollTop = sameTitle ? st : 0;
    markLoaded(p); return;
  }
  sheetFocus = document.activeElement;
  host.insertAdjacentHTML('beforeend', `<div class="sheet" data-act="closesheet"><div class="panel" data-stop="1" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`);
  const p = host.lastElementChild.querySelector('.panel'); markLoaded(p);
  const h = p.querySelector('h2'); if (h) { p.setAttribute('aria-label', h.textContent); }
  syncBack();
}

/* ======================= events ======================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('.sheet.closing, main.snap')) return;
  const stop = e.target.closest('[data-stop]');
  if (stop && el.dataset.act === 'closesheet' && el.classList.contains('sheet')) return;
  if (el.closest('.brief')) sheet('');
  const a = el.dataset.act, v = el.dataset.v, d = +el.dataset.d;
  if (['tab', 'cat', 'variant', 'deliv', 'day', 'time', 'pay', 'rday', 'rtime', 'onlyfit', 'pickbrand', 'pickmodel', 'order', 'inst', 'pinst', 'bonus', 'ntoggle'].includes(a)) hSel();
  switch (a) {
    case 'tab':
      if (S.tab === v && !S.product && !S.carInfo) { $('#view').scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); return; }
      S.tab = v; S.product = null; S.carInfo = null; sheet(''); break;
    case 'gosearch': S.tab = 'catalog'; S.cat = 'all'; S.product = null; S.carInfo = null; render.reset = true; render(); { const q = $('#q'); q && q.focus(); } return;
    case 'story': openStory(+v); return;
    case 'product': openProduct(v); break;
    case 'back': goBack(); return;
    case 'fav': S.fav.has(v) ? S.fav.delete(v) : S.fav.add(v); haptic(); if (sheetOpen() && !S.product && $('#sheet h2') && $('#sheet h2').textContent === 'Избранное') { favSheet(); } break;
    case 'quickadd': {
      if (inCart(v)) { S.tab = 'cart'; S.product = null; S.carInfo = null; sheet(''); break; }
      const p = PM[v]; if (p.v || p.svc) { openProduct(v); break; }
      S.cart.push({ id: v, v: null, qty: 1, inst: false }); hNote('success'); toast('Добавлено в корзину'); break; }
    case 'variant': S.pv = v; break;
    case 'pinst': S.pinst = !S.pinst; break;
    case 'pqty': S.pqty = Math.max(1, Math.min(9, S.pqty + d)); break;
    case 'addp': {
      const p = PM[S.product];
      const ex = S.cart.find(i => i.id === p.id && i.v === S.pv);
      if (ex) ex.qty += S.pqty; else S.cart.push({ id: p.id, v: S.pv, qty: p.svc ? 1 : S.pqty, inst: p.svc ? false : S.pinst });
      hNote('success'); toast(p.svc ? 'Услуга в корзине, время выберете при оформлении' : 'Добавлено в корзину'); break; }
    case 'qty': { const it = S.cart[+v]; it.qty += d; if (it.qty <= 0 || PM[it.id].svc) S.cart.splice(+v, 1); break; }
    case 'inst': S.cart[+v].inst = !S.cart[+v].inst; break;
    case 'clear': S.cart = []; break;
    case 'cat': S.cat = v; S.tab = 'catalog'; S.product = null; S.carInfo = null; SCROLL.catalog = 0; render.reset = true; sheet(''); break;
    case 'onlyfit': S.onlyFit = !S.onlyFit; break;
    case 'resetfilters': S.onlyFit = false; S.cat = 'all'; S.q = ''; break;
    /* car picker */
    case 'carsheet': openPicker(); return;
    case 'pickbrand': S.picker.step = 'model'; S.picker.b = v; sheet(pickerHtml()); return;
    case 'pickmodel': { const [b, m] = v.split('|'); S.picker.b = b; S.picker.m = m; S.picker.step = 'mod'; sheet(pickerHtml()); return; }
    case 'pickstep': S.picker.step = v; if (v === 'brand') S.picker.q = ''; sheet(pickerHtml()); return;
    case 'pickmod': {
      const g = { b: S.picker.b, m: S.picker.m, i: +v };
      let ix = S.garage.findIndex(x => x.b === g.b && x.m === g.m && x.i === g.i);
      if (ix < 0) { S.garage.push(g); ix = S.garage.length - 1; }
      S.active = ix; S.onlyFit = true; sheet(''); haptic('medium');
      const c = resolveCar(g); toast(`${c.title} в гараже · подбор включён`); break; }
    case 'setactive': S.active = +v; toast('Подбор для ' + resolveCar(S.garage[+v]).title); break;
    case 'rmcar': S.garage.splice(+v, 1); if (S.active >= S.garage.length) S.active = Math.max(0, S.garage.length - 1); S.carInfo = null; toast('Автомобиль удалён из гаража'); break;
    case 'carinfo': S.carInfo = { ix: +v }; break;
    case 'setmod': S.garage[S.carInfo.ix].i = +v; break;
    case 'shopfor': S.active = +v; S.onlyFit = true; S.cat = 'all'; S.q = ''; S.tab = 'catalog'; S.carInfo = null; SCROLL.catalog = 0; break;
    /* cart */
    case 'deliv': S.delivery = v; break;
    case 'day': S.day = v; S.time = null; break;
    case 'time': S.time = v; break;
    case 'promo': {
      S.promo = ($('#promo').value || '').trim().toUpperCase();
      S.promoOk = S.promo === 'GTJ10';
      S.promoMsg = S.promoOk ? 'Промокод применён: −10% на детали' : (S.promo ? 'Такого промокода нет. Проверьте написание' : 'Введите промокод');
      break; }
    case 'bonus': S.useBonus = !S.useBonus; break;
    case 'checkout': checkoutSheet(); return;
    case 'pay': el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); return;
    case 'gotoorders': sheet(''); S.tab = 'profile'; S.product = null; S.carInfo = null; break;
    /* profile */
    case 'order': S.openOrder = S.openOrder === v ? null : v; break;
    case 'favs': favSheet(); return;
    case 'addresses': addrSheet(); return;
    case 'rmaddr': S.addr.splice(+v, 1); persist(); addrSheet(); break;
    case 'notifsettings': notifSettingsSheet(); return;
    case 'ntoggle': S.notify[v] = !S.notify[v]; persist(); notifSettingsSheet(); break;
    case 'notifs': notifsSheet(); return;
    case 'club': clubSheet(); return;
    case 'editme': editMeSheet(); return;
    case 'reschedule': rescheduleSheet(); return;
    case 'rday': case 'rtime': el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); return;
    case 'rconfirm': sheet(''); toast('Запрос на перенос отправлен менеджеру'); return;
    case 'about': aboutSheet(); return;
    case 'manager': if (tg && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(BOT); } return;
    case 'closesheet': sheet(''); return;
    case 'share': {
      const url = BOT + '/shop?startapp=' + S.product;
      try { if (tg && tg.openTelegramLink) { tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(PM[S.product].n)); return; } } catch (err) {}
      try { navigator.clipboard.writeText(url).then(() => toast('Ссылка на товар скопирована'), () => toast(url)); } catch (err) { toast(url); }
      return; }
  }
  render();
});

/* ======================= stories ======================= */
const SV = { i: 0, j: 0, held: 0, moved: false };
function openStory(i, j = 0) {
  const s = STORIES[i]; if (!s) return closeStory();
  SV.i = i; SV.j = j; S.seen.add(s.id); persist();
  const it = s.items[j];
  const host = $('#story');
  const fresh = !host.querySelector('.sv:not(.out)');
  host.innerHTML = `<div class="sv" role="dialog" aria-modal="true" aria-label="${esc(s.t)}" ${fresh ? '' : 'style="animation:none"'}>
    <img class="sv-img" src="${IMG}${it.img}" alt="${esc(it.t)}">
    <div class="sv-bars">${s.items.map((_, k) => `<i class="${k < j ? 'done' : ''}"><b class="${k === j ? 'run' : ''}"></b></i>`).join('')}</div>
    <div class="sv-head"><img src="${IMG}${s.cover}" alt=""><b>${esc(s.t)}</b><span style="opacity:.7">GTJ</span><button data-sv="close" aria-label="Закрыть">${ic('close')}</button></div>
    <button class="sv-tap l" data-sv="prev" aria-label="Предыдущая"></button><button class="sv-tap r" data-sv="next" aria-label="Следующая"></button>
    <div class="sv-cap"><b>${esc(it.t)}</b><span>${esc(it.s)}</span>${it.cta ? `<button class="btn btn-cream btn-block" data-sv="cta">${esc(it.cta[2])}</button>` : ''}</div>
  </div>`;
  const nxt = s.items[j + 1] || (STORIES[i + 1] && STORIES[i + 1].items[0]); if (nxt) new Image().src = IMG + nxt.img;
  const bar = host.querySelector('b.run'); if (bar) bar.addEventListener('animationend', storyNext, { once: true });
  if (fresh) hSel();
  syncBack();
}
function storyNext() { const s = STORIES[SV.i]; if (SV.j < s.items.length - 1) openStory(SV.i, SV.j + 1); else if (SV.i < STORIES.length - 1) openStory(SV.i + 1, 0); else closeStory(); }
function storyPrev() { if (SV.j > 0) openStory(SV.i, SV.j - 1); else if (SV.i > 0) openStory(SV.i - 1, 0); else openStory(SV.i, 0); }
function closeStory() {
  const sv = $('#story .sv:not(.out)'); if (!sv) return;
  sv.style.animation = ''; sv.classList.add('out');
  const done = () => { if (sv.parentNode) sv.parentNode.innerHTML = ''; syncBack(); };
  if (REDUCED) done(); else setTimeout(done, 200);
  render();
}
(() => {
  const host = $('#story'); let y0 = 0, x0 = 0;
  host.addEventListener('pointerdown', e => { const sv = host.querySelector('.sv'); if (!sv) return; SV.held = e.timeStamp; SV.moved = false; y0 = e.clientY; x0 = e.clientX; sv.classList.add('paused'); });
  host.addEventListener('pointermove', e => { const sv = host.querySelector('.sv'); if (!sv || !SV.held) return; const dy = e.clientY - y0; if (dy > 10 && dy > Math.abs(e.clientX - x0)) { SV.moved = true; sv.style.transform = `translateY(${dy}px) scale(${1 - dy / 2000})`; sv.style.animation = 'none'; } });
  const up = e => {
    const sv = host.querySelector('.sv'); if (!sv) return; sv.classList.remove('paused');
    const dy = e.clientY - y0;
    if (SV.moved) { SV.held = 0; if (dy > 110) closeStory(); else { sv.style.transition = 'transform .2s'; sv.style.transform = ''; } return; }
    SV.long = e.timeStamp - SV.held > 300; SV.held = 0;
  };
  host.addEventListener('pointerup', up); host.addEventListener('pointercancel', up);
  host.addEventListener('click', e => {
    const b = e.target.closest('[data-sv]'); if (!b || SV.moved || SV.long) { SV.long = false; return; }
    const k = b.dataset.sv; const it = STORIES[SV.i].items[SV.j];
    if (k === 'close') closeStory();
    else if (k === 'next') { hSel(); storyNext(); }
    else if (k === 'prev') { hSel(); storyPrev(); }
    else if (k === 'cta' && it.cta) {
      const [t, id] = it.cta; closeStory();
      if (t === 'product') { openProduct(id); render(); }
      else if (t === 'cat') { S.cat = id; S.tab = 'catalog'; SCROLL.catalog = 0; render.reset = true; render(); }
      else if (t === 'club') clubSheet();
    }
  });
})();

/* ======================= gestures ======================= */
(() => {
  const vp = $('#vp'), view = $('#view');
  view.addEventListener('scroll', onScroll, { passive: true });
  // iOS needs a touch listener for :active press states
  document.addEventListener('touchstart', () => {}, { passive: true });
  // images fade in when they arrive
  document.addEventListener('load', e => { if (e.target.tagName === 'IMG') e.target.classList.add('ld'); }, true);

  // no zoom: pinch, double tap, ctrl+wheel
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  let lastEnd = 0;
  document.addEventListener('touchend', e => {
    if (e.timeStamp - lastEnd < 320 && !e.target.closest('button,a,input,textarea,select,label,[data-act],[data-sv]')) e.preventDefault();
    lastEnd = e.timeStamp;
  }, { passive: false });
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

  // swipe from the left edge goes back, the screen underneath follows the finger
  let sw = null;
  vp.addEventListener('touchstart', e => {
    if (!(S.product || S.carInfo) || REDUCED || e.touches.length > 1) return;
    const t = e.touches[0], r = vp.getBoundingClientRect();
    if (t.clientX - r.left > 28) return;
    sw = { x: t.clientX, y: t.clientY, dx: 0, on: false, w: r.width, t0: e.timeStamp };
  }, { passive: true });
  vp.addEventListener('touchmove', e => {
    if (!sw) return;
    const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if (!sw.on) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
      if (dx < 10) return;
      sw.on = true; sw.under = snapOf(TABS[S.tab](), SCROLL[S.tab] || 0);
    }
    e.preventDefault();
    sw.dx = Math.max(0, dx); const k = sw.dx / sw.w;
    view.style.transform = `translateX(${sw.dx}px)`;
    sw.under.style.transform = `translateX(${-28 * (1 - k)}%)`;
    sw.under.style.filter = `brightness(${.55 + .45 * k})`;
  }, { passive: false });
  const end = e => {
    if (!sw) return; const s = sw; sw = null; if (!s.on) return;
    const v = s.dx / Math.max(1, e.timeStamp - s.t0);
    const go = s.dx > s.w * 0.35 || v > 0.6;
    const o = { duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' };
    const from = view.style.transform, uf = { transform: s.under.style.transform, filter: s.under.style.filter };
    view.style.transform = ''; s.under.style.transform = ''; s.under.style.filter = '';
    if (go) {
      const a = view.animate([{ transform: from }, { transform: 'translateX(100%)' }], o);
      s.under.animate([uf, { transform: 'none', filter: 'brightness(1)' }], o);
      a.onfinish = () => { haptic('light'); goBack(true); a.cancel(); s.under.remove(); };
    } else {
      const a = view.animate([{ transform: from }, { transform: 'none' }], o);
      s.under.animate([uf, { transform: 'translateX(-28%)', filter: 'brightness(.55)' }], o).onfinish = () => s.under.remove();
      a.onfinish = () => a.cancel();
    }
  };
  vp.addEventListener('touchend', end); vp.addEventListener('touchcancel', end);

  // drag a bottom sheet down to close it
  let sd = null;
  const host = $('#sheet');
  host.addEventListener('touchstart', e => {
    const p = e.target.closest('.panel'); if (!p || e.touches.length > 1) return;
    if (e.target.closest('input,textarea,select,.hscroll,.chips')) return;
    if (p.scrollTop > 0 && !e.target.closest('.grab,.shead')) return;
    sd = { p, y: e.touches[0].clientY, x: e.touches[0].clientX, dy: 0, on: false, t0: e.timeStamp };
  }, { passive: true });
  host.addEventListener('touchmove', e => {
    if (!sd) return;
    const dy = e.touches[0].clientY - sd.y, dx = e.touches[0].clientX - sd.x;
    if (!sd.on) { if (dy > 8 && dy > Math.abs(dx)) sd.on = true; else { if (Math.abs(dx) > 8 || dy < -8) sd = null; return; } }
    e.preventDefault();
    sd.dy = Math.max(0, dy - 8);
    sd.p.style.transform = `translateY(${sd.dy}px)`;
    sd.p.parentElement.style.backgroundColor = `rgba(0,0,0,${.55 * Math.max(0, 1 - sd.dy / sd.p.offsetHeight)})`;
  }, { passive: false });
  const sEnd = e => {
    if (!sd) return; const s = sd; sd = null; if (!s.on) return;
    const v = s.dy / Math.max(1, e.timeStamp - s.t0);
    if (s.dy > 110 || v > 0.7) { sheet(''); return; }
    s.p.animate([{ transform: s.p.style.transform }, { transform: 'none' }], { duration: 200, easing: 'cubic-bezier(.2,.8,.2,1)' });
    s.p.style.transform = ''; s.p.parentElement.style.backgroundColor = '';
  };
  host.addEventListener('touchend', sEnd); host.addEventListener('touchcancel', sEnd);
})();

/* ======================= telegram ======================= */
if (tg) {
  try {
    tg.ready(); tg.expand();
    const at = v => tg.isVersionAtLeast && tg.isVersionAtLeast(v);
    if (at('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes();   // scrolling down no longer collapses the app
    if (at('6.1')) { tg.setHeaderColor('#0d0e10'); tg.setBackgroundColor('#0d0e10'); }
    if (at('7.10') && tg.setBottomBarColor) tg.setBottomBarColor('#101113');
    tg.BackButton.onClick(() => goBack());
    const sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
    if (sp && PM[sp]) openProduct(sp);
  } catch (e) {}
  document.getElementById('tgbar').hidden = true;
}
render();
</script>

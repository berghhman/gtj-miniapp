<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2025">
<link rel="icon" href="img/gtj-wordmark.svg" type="image/svg+xml">
<title>GTJ Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Design read: Telegram shop for tuning Chinese cars · owners of Monjaro/Preface/Tiggo who want more power and a better look ·
   garage spec sheet: gunmetal surfaces, caliper-yellow for action and gains, condensed Oswald (same face as the GTJ plate) for names and numbers.
   Layout: one phone column. The memorable element is the dyno card for the owner's car; everything around it stays quiet. */
:root{
  /* color */
  --bg:#1d2025;        /* gunmetal ground */
  --s1:#25292f;        /* surface: cards, lists */
  --s2:#2d3238;        /* raised: inputs, pressed, tiles */
  --line:#383e46;      /* hairlines, separators */
  --track:#66707b;     /* off-state controls, ≥3:1 on surfaces */
  --fg:#eef0f2;
  --muted:#a3abb5;     /* 6.3:1 on --s1 */
  --accent:#ffc53d;    /* caliper yellow: primary action, active state, power gain */
  --on-accent:#1d1a10;
  --ok:#74d69f;
  --warn:#ff9b52;
  --red:#cf2630;       /* sale / count badges only */
  --tile:#d9dce0;      /* studio backdrop for product cut-outs */
  --backdrop:#131518;
  /* type */
  --f-head:"Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-xs:12px; --t-s:13px; --t-m:15px; --t-l:18px; --t-xl:22px; --t-2xl:28px; --t-3xl:36px;
  /* shape & space */
  --r-s:8px; --r-m:14px; --r-l:22px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --hit:44px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--backdrop);color:var(--fg);font:400 var(--t-m)/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-s)}
img{display:block;max-width:100%}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:16px;height:16px}
.ico.filled{fill:currentColor}
.num{font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- stage ---------- */
.stage{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:64px}
.brief{display:none}
.app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:640px){
  .stage{padding:var(--sp-5)}
  .app{height:min(900px,100%);border-radius:40px;border:1px solid #30353c;box-shadow:0 0 0 10px #0d0e10,0 0 0 11px #2b3036,0 40px 90px rgba(0,0,0,.55)}
}
@media (min-width:1000px){
  .brief{display:flex;flex-direction:column;gap:var(--sp-5);width:320px}
  .brief img{width:180px}
  .brief h1{font:600 30px/1.15 var(--f-head);margin:0;text-wrap:balance}
  .brief p{margin:0;color:var(--muted);max-width:34ch}
  .brief nav{display:flex;flex-direction:column;border-radius:var(--r-m);background:#1a1d21;overflow:hidden}
  .brief nav button{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 var(--sp-4);border-bottom:1px solid #262a30;font-weight:500}
  .brief nav button:last-child{border-bottom:0}
  .brief nav button:hover{background:#22262b}
}

/* ---------- telegram chrome (only outside Telegram) ---------- */
.tgbar{flex:none;display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 var(--sp-4);background:#202328;border-bottom:1px solid var(--line);font-size:var(--t-s)}
.tgbar b{font-weight:600;display:block;text-align:center;line-height:1.2;font-size:var(--t-m)}
.tgbar small{display:block;text-align:center;color:var(--muted);font-size:var(--t-xs)}
.tgbar .tgx{color:#6ab3f3;font-weight:500;min-width:64px}
.tgbar .tgm{min-width:64px;text-align:right;color:var(--muted);font-size:20px;line-height:1}

/* ---------- view ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 var(--sp-4) var(--sp-6);overscroll-behavior:contain}
main::-webkit-scrollbar{width:0}
.sec{display:flex;flex-direction:column;gap:var(--sp-3);margin-top:var(--sp-6)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3)}
h2.h{margin:0;font:500 var(--t-xl)/1.15 var(--f-head);letter-spacing:.005em;text-wrap:balance}
.link{display:inline-flex;align-items:center;gap:2px;min-height:var(--hit);color:var(--accent);font-size:var(--t-s);font-weight:600;white-space:nowrap}
.cap{font-size:var(--t-xs);color:var(--muted)}

/* header */
.top{position:sticky;top:0;z-index:5;margin:0 calc(var(--sp-4) * -1);padding:var(--sp-3) var(--sp-4);background:linear-gradient(var(--bg) 80%,rgba(29,32,37,0));display:flex;flex-direction:column;gap:var(--sp-3)}
.brandrow{display:flex;align-items:center;gap:var(--sp-3)}
.brandrow img{width:70px;height:auto}
.brandrow .t{flex:1;min-width:0;font-size:var(--t-s);color:var(--muted);line-height:1.3}
.iconbtn{position:relative;width:var(--hit);height:var(--hit);border-radius:var(--r-m);display:grid;place-items:center;background:var(--s1);flex:none}
.iconbtn:active{background:var(--s2)}
.iconbtn.glass{background:rgba(29,32,37,.78);backdrop-filter:blur(8px)}
.dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:700 11px/18px var(--f-body);text-align:center}
.search{display:flex;align-items:center;gap:var(--sp-2);height:48px;padding:0 var(--sp-4);border-radius:var(--r-m);background:var(--s1);color:var(--muted)}
.search:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--fg)}
.search input::placeholder{color:var(--muted)}

/* dyno card — the one loud element */
.dyno{border-radius:var(--r-l);background:var(--s1);overflow:hidden}
.dyno .car{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);width:100%}
.dyno .car .ph{width:64px;height:48px;border-radius:10px;overflow:hidden;background:var(--s2);display:grid;place-items:center;color:var(--muted);flex:none}
.dyno .car .ph img{width:100%;height:100%;object-fit:cover}
.dyno .car .t{flex:1;min-width:0}
.dyno .car b{display:block;font:500 var(--t-l)/1.2 var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dyno .car span{font-size:var(--t-s);color:var(--muted)}
.dyno .car .chg{color:var(--accent);font-size:var(--t-s);font-weight:600;display:flex;align-items:center;gap:2px;min-height:var(--hit)}
.dyno .chart{padding:0 var(--sp-4)}
.dyno svg{display:block;width:100%;height:auto}
.dyno .read{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4) 0}
.dyno .read .big{font:600 var(--t-3xl)/1 var(--f-head);letter-spacing:-.01em}
.dyno .read .big small{font:500 var(--t-m) var(--f-body);color:var(--muted);margin-left:4px}
.dyno .read .from{font-size:var(--t-s);color:var(--muted);text-align:right;line-height:1.35}
.dyno .read .gain{color:var(--accent);font-weight:700}
.dyno .stages{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-1);margin:var(--sp-3) var(--sp-4) 0;padding:var(--sp-1);border-radius:var(--r-m);background:var(--s2)}
.dyno .stages button{min-height:40px;border-radius:10px;font-weight:600;font-size:var(--t-s);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.dyno .stages button.on{background:var(--bg);color:var(--fg)}
.dyno .stages button.on em{color:var(--accent)}
.dyno .stages em{font-style:normal}
.dyno .cta{padding:var(--sp-3) var(--sp-4) var(--sp-4)}
.dyno .note{margin:0;padding:0 var(--sp-4) var(--sp-4);font-size:var(--t-xs);color:var(--muted)}
.dyno .empty-car{padding:var(--sp-5) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
.dyno .empty-car h3{margin:0;font:500 var(--t-xl)/1.2 var(--f-head)}
.dyno .empty-car p{margin:0;color:var(--muted);font-size:var(--t-s)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:48px;padding:0 var(--sp-5);border-radius:var(--r-m);font-weight:600;font-size:var(--t-m);white-space:nowrap;text-decoration:none}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-accent:active{filter:brightness(.92)}
.btn-quiet{background:var(--s2);color:var(--fg)}
.btn-quiet:active{background:var(--line)}
.btn-block{width:100%}
.btn-split{justify-content:space-between;width:100%;padding:0 var(--sp-4) 0 var(--sp-5)}
.btn-split .p{font:600 var(--t-l) var(--f-head)}
.btn-sm{min-height:40px;padding:0 var(--sp-4);font-size:var(--t-s);border-radius:12px}

/* category groups */
.groups{display:flex;flex-direction:column;gap:var(--sp-4)}
.group .gt{font-size:var(--t-s);color:var(--muted);margin:0 0 var(--sp-2) var(--sp-1)}
.list{border-radius:var(--r-m);background:var(--s1);overflow:hidden}
.list>*{display:flex;align-items:center;gap:var(--sp-3);min-height:52px;padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-4);width:100%;text-decoration:none;position:relative}
.list>*+*::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:1px solid var(--line)}
.list>*:active{background:var(--s2)}
.list .ico:first-child{color:var(--accent)}
.list .t{flex:1;min-width:0}
.list .t small{display:block;color:var(--muted);font-size:var(--t-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .v{color:var(--muted);font-size:var(--t-s)}
.list .chev{color:var(--muted);width:18px;height:18px}

/* product cards */
.hscroll{display:flex;gap:var(--sp-3);overflow-x:auto;margin:0 calc(var(--sp-4) * -1);padding:0 var(--sp-4) var(--sp-1);scroll-snap-type:x mandatory;scroll-padding:0 var(--sp-4)}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r-m);background:var(--s1);overflow:hidden}
.hscroll .card{width:164px}
.media{position:relative;display:block;width:100%;aspect-ratio:1/1;background:var(--tile);overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover}
.media.contain img{object-fit:contain;padding:9%}
.media .badge{position:absolute;left:var(--sp-2);bottom:var(--sp-2)}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font:700 var(--t-xs)/1.3 var(--f-body);background:var(--red);color:#fff}
.badge.new{background:var(--fg);color:var(--bg)}
.favbtn{position:absolute;top:0;right:0;width:var(--hit);height:var(--hit);display:grid;place-items:center;color:#fff}
.favbtn span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(29,32,37,.6);backdrop-filter:blur(6px)}
.favbtn .ico{width:17px;height:17px}
.favbtn.on{color:#ff5a63}
.favbtn.on .ico{fill:currentColor}
.card .info{display:flex;flex-direction:column;gap:6px;padding:var(--sp-3);flex:1}
.fitnote{display:flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:600;color:var(--ok)}
.fitnote.no{color:var(--muted);font-weight:500}
.fitnote .ico{width:14px;height:14px;stroke-width:2.25}
.card .name{font-size:var(--t-s);font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .pr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:var(--sp-1)}
.price{font:500 var(--t-l)/1 var(--f-head);font-variant-numeric:tabular-nums;white-space:nowrap}
.old{font-size:var(--t-xs);color:var(--muted);text-decoration:line-through}
.addbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex:none}
.addbtn.in{background:var(--s2);color:var(--ok)}
.addbtn .ico{width:20px;height:20px;stroke-width:2.25}

/* tile for items without a photo: dyno-paper grid + category icon */
.tile{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:var(--sp-3);color:var(--fg);
  background-color:var(--s2);background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px}
.tile .gl{width:44%;height:auto;aspect-ratio:1;align-self:center;margin:auto 0;color:var(--muted);stroke-width:1.25}
.tile .word{font:600 var(--t-xl)/1 var(--f-head);color:var(--fg);align-self:center;margin:auto 0;letter-spacing:.04em}
.tile .k{font:500 var(--t-l)/1.1 var(--f-head)}
.tile .v{font:600 var(--t-2xl)/1 var(--f-head);color:var(--accent)}
.tile .s{font-size:var(--t-xs);color:var(--muted)}

/* works */
.work{width:236px;border-radius:var(--r-m);overflow:hidden;background:var(--s1)}
.work img{width:100%;aspect-ratio:4/3;object-fit:cover}
.work div{padding:var(--sp-3)}
.work b{display:block;font-weight:600;font-size:var(--t-s)}
.work span{font-size:var(--t-xs);color:var(--muted)}

/* chips */
.chips{display:flex;gap:var(--sp-2);overflow-x:auto;margin:0 calc(var(--sp-4) * -1);padding:0 var(--sp-4)}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.chip{flex:none;min-height:40px;padding:0 var(--sp-4);border-radius:20px;background:var(--s1);font-size:var(--t-s);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg)}
.chip.car.on{background:var(--accent);color:var(--on-accent)}
.chip .ico{width:16px;height:16px}
.chip:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);color:var(--muted);font-size:var(--t-s)}
.toolbar select{background:var(--s1);border:0;border-radius:12px;min-height:40px;padding:0 var(--sp-3)}

/* product page */
.pp{margin:0 calc(var(--sp-4) * -1)}
.pnav{position:sticky;top:0;z-index:6;height:0;display:flex;justify-content:space-between;align-items:flex-start;padding:var(--sp-3) var(--sp-4) 0}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--tile)}
.gal::-webkit-scrollbar{display:none}
.gal .media{flex:none;width:100%;scroll-snap-align:center}
.gal .tile{padding-top:72px}
.gdots{display:flex;gap:6px;justify-content:center;margin-top:-22px;position:relative;z-index:1}
.gdots i{width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.28)}
.gdots i.on{width:18px;background:#1d2025}
.pbody{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-4)}
.pbody h1{margin:0;font:500 var(--t-2xl)/1.15 var(--f-head);text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-3);align-items:center;color:var(--muted);font-size:var(--t-s)}
.meta .stock{color:var(--ok);font-weight:600}
.fitbar{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-m);font-size:var(--t-s);font-weight:500;width:100%;text-align:left;background:var(--s1)}
.fitbar.ok{color:var(--ok)}
.fitbar.no{color:var(--warn)}
.fitbar.uni{color:var(--muted)}
.pricebig{display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap}
.pricebig .price{font-size:var(--t-3xl);font-weight:600}
.pricebig .bonus{font-size:var(--t-s);color:var(--muted)}
.pricebig .bonus b{color:var(--fg);font-weight:600}
.opt{display:flex;flex-direction:column;gap:var(--sp-2)}
.opt .lbl{font-size:var(--t-s);color:var(--muted)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.row{display:flex;align-items:center;gap:var(--sp-3);min-height:56px;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-m);background:var(--s1);width:100%;text-align:left}
.row .t{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:var(--t-m)}
.row span{font-size:var(--t-s);color:var(--muted)}
.row>.ico:first-child{color:var(--accent)}
.toggle{position:relative;width:48px;height:28px;border-radius:14px;background:var(--track);flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.toggle.on{background:var(--ok)}
.toggle.on::after{transform:translateX(20px)}
.desc{margin:0;color:#d5d9de;line-height:1.6;max-width:62ch}
.specs{width:100%;border-collapse:collapse;font-size:var(--t-s)}
.specs td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.specs tr:last-child td{border-bottom:0}
.specs td:first-child{color:var(--muted);width:44%;padding-right:var(--sp-3)}
.gainrow{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.gainrow div{padding:var(--sp-3) var(--sp-4);border-radius:var(--r-m);background:var(--s1)}
.gainrow small{display:block;color:var(--muted);font-size:var(--t-xs);margin-bottom:2px}
.gainrow b{font:600 var(--t-xl) var(--f-head);font-variant-numeric:tabular-nums}
.gainrow em{font-style:normal;color:var(--accent);font-weight:700;font-size:var(--t-s);margin-left:6px}
.credit{font-size:var(--t-xs);color:var(--muted)}
.actionbar{flex:none;display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-3) var(--sp-4) calc(var(--sp-3) + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -1px 0 var(--line)}
.actionbar .btn-accent{flex:1}
.stepper{display:inline-flex;align-items:center;height:48px;border-radius:var(--r-m);background:var(--s1)}
.stepper button{width:var(--hit);height:100%;display:grid;place-items:center}
.stepper span{min-width:20px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stepper.sm{height:40px;border-radius:12px;background:var(--s2)}
.stepper.sm button{width:40px}
.stepper .ico{width:18px;height:18px}

/* page title */
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding-top:var(--sp-4)}
.ptitle h1{margin:0;font:500 var(--t-2xl)/1.1 var(--f-head);min-width:0}

/* cart */
.citem{display:grid;grid-template-columns:76px minmax(0,1fr);gap:var(--sp-3);padding:var(--sp-3);border-radius:var(--r-m);background:var(--s1)}
.citem .media{border-radius:10px}
.citem .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.citem .nm{font-weight:500;font-size:var(--t-s);line-height:1.3}
.citem .vr{font-size:var(--t-xs);color:var(--muted)}
.citem .bot{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}

<script>
/* ======================= data ======================= */
const IMG = 'img/';
const BOT = 'https://t.me/GTJdetailing_bot';
const CARS = window.GTJ_CARS, ENG = window.GTJ_ENGINES, IC = window.GTJ_ICONS;
const CATS = window.GTJ_CATS, P = window.GTJ_PRODUCTS, CREDITS = window.GTJ_CREDITS;
const PM = Object.fromEntries(P.map(p => [p.id, p]));
const CATM = Object.fromEntries(CATS.map(c => [c.id, c]));
/* 16 рубрик → 4 группы, чтобы главная читалась за секунды */
const GROUPS = [
  { n: 'Мощность', cats: ['chip', 'turbo', 'intake', 'exhaust', 'engine', 'cooling'] },
  { n: 'Ходовая и тормоза', cats: ['brakes', 'susp'] },
  { n: 'Внешний вид и салон', cats: ['detail', 'ext', 'int', 'chem'] },
  { n: 'Расходники и мелочи', cats: ['hoses', 'fittings', 'elec', 'merch'] },
];
const WORKS = [
  { img: 'work-intercooler.jpg', t: 'Интеркулер на Preface', s: 'Stage 2, один день в боксе' },
  { img: 'work-lift.jpg', t: 'Диски и занижение', s: 'Preface на койловерах' },
  { img: 'brakes.jpg', t: 'Тормоза на 6 поршней', s: 'Monjaro, диски 380 мм' },
  { img: 'preface-purple.jpg', t: 'Обвес и карбон', s: 'Preface в цветном полиуретане' },
  { img: 'meet2.jpg', t: 'Сходка клуба', s: 'Машины наших клиентов' },
  { img: 'work-monjaro.jpg', t: 'Пакет охлаждения', s: 'Monjaro 2.0T' },
];
const ic = (n, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || IC.package}</svg>`;

/* ======================= state ======================= */
const tg = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) ? window.Telegram.WebApp : null;
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem('gtj-' + k) || 'null'); return v == null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem('gtj-' + k, JSON.stringify(v)); } catch (e) {} };

const S = {
  tab: 'home', product: null, carInfo: null, pv: null, pqty: 1, pinst: false, stage: 2,
  onlyFit: true, cat: 'all', q: '', sort: 'pop',
  cart: load('cart', [{ id: 'dv', v: null, qty: 1, inst: true }, { id: 'struts', v: 'red', qty: 1, inst: false }]),
  fav: new Set(load('fav', ['intercooler', 'bbk6'])),
  garage: load('garage', [{ b: 'geely', m: 'monjaro', i: 0, plate: ['К', '238', 'МЖ', '178'] }]),
  active: load('active', 0),
  delivery: 'pickup', day: null, time: null, promo: '', promoOk: false, promoMsg: '', useBonus: false,
  bonus: 4890, openOrder: 'GTJ-2471',
  notify: load('notify', { orders: true, box: true, promo: false }),
  addr: load('addr', [{ t: 'Пункт СДЭК', a: 'Санкт-Петербург, ул. Профессора Попова, 23' }]),
  me: load('me', { name: tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') : 'Дмитрий Королёв', phone: '+7 921 555-23-88' }),
  picker: { step: 'brand', b: null, m: null, q: '' },
  orders: [
    { id: 'GTJ-2471', date: '6 окт', items: 'Распорки TTCR-II, красный', sum: 27900, st: 'ship', stText: 'В пути, СДЭК', step: 3 },
    { id: 'GTJ-2468', date: '4 окт', items: 'Интеркулер увеличенный с установкой', sum: 70000, st: 'wait', stText: 'Ждёт установки', step: 2 },
    { id: 'GTJ-2417', date: '28 сен', items: 'Клапан DV+, адаптер, установка', sum: 29300, st: 'done', stText: 'Выполнен', step: 4 },
  ],
};
S.cart = S.cart.filter(i => PM[i.id]);
S.garage = S.garage.filter(g => resolveCar(g));
if (S.active >= S.garage.length) S.active = 0;
const persist = () => { save('cart', S.cart); save('fav', [...S.fav]); save('garage', S.garage); save('active', S.active); save('notify', S.notify); save('addr', S.addr); save('me', S.me); };

/* ======================= helpers ======================= */
const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CM = (t, w = 640) => 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(t) + '?width=' + w;
function modSpec(d) { return `${d[0]}, ${d[2]} л.с., ${d[4]}, ${d[5]} привод`; }
function resolveCar(g) {
  const b = CARS.find(x => x.id === g.b); if (!b) return null;
  const m = b.models.find(x => x.id === g.m); if (!m || !m.m[g.i]) return null;
  const d = m.m[g.i];
  return { b, m, d, eng: d[1], fuel: d[7], key: b.id + '/' + m.id, title: b.n + ' ' + m.n, short: m.n, spec: modSpec(d) };
}
const car = () => S.garage[S.active] ? resolveCar(S.garage[S.active]) : null;
function fits(p, c = car()) {
  if (!c) return true;
  const f = p.fit;
  if (p.stage) return ENG[c.eng] && ENG[c.eng].s1 && ['p', 'd', 'hev'].includes(c.fuel) && (f === 'turbo' || (Array.isArray(f) && f.includes(c.eng)));
  if (f === 'all') return true;
  if (f === 'ice') return c.fuel !== 'ev';
  if (f === 'turbo') return !!(ENG[c.eng] && ENG[c.eng].turbo) && c.fuel !== 'ev';
  if (Array.isArray(f)) return f.includes(c.eng);
  if (f && f.models) return f.models.includes(c.key);
  return true;
}
const universal = p => p.fit === 'all';
function stageGain(p, c = car()) {
  if (!p.stage || !c) return null;
  const E = ENG[c.eng]; if (!E || !E.s1 || !fits(p, c)) return null;
  const s2 = E.s2 || E.s1;
  const t = p.stage === 1 ? E.s1 : p.stage === 2 ? s2 : [s2[0] + 45, s2[1] + 80];
  return { hp: t[0], nm: t[1], dhp: t[0] - c.d[2], dnm: t[1] - c.d[3] };
}
const unitPrice = (p, v) => { const vr = p.v && p.v.find(x => x.id === v); return vr && vr.p ? vr.p : p.p; };
const minPrice = p => p.v ? Math.min(...p.v.map(x => x.p || p.p)) : p.p;
function pimg(p, v) {
  const vr = p.v && p.v.find(x => x.id === v);
  if (vr && vr.img) return IMG + vr.img;
  if (p.img) return IMG + p.img;
  if (p.cm) return CM(p.cm);
  return null;
}
const gallery = (p, v) => { const vr = p.v && p.v.find(x => x.id === v); if (vr && vr.img) return [IMG + vr.img]; if (p.gal) return p.gal.map(x => IMG + x); const one = pimg(p, v); return one ? [one] : []; };
const isContain = p => ['dv.jpg', 'bov.jpg', 'coilovers.jpg', 'pedals.jpg', 'turbo.jpg', 'struts-red.jpg'].includes(p.img) || (p.cm && /\.png$/i.test(p.cm));
const cartCount = () => S.cart.reduce((a, i) => a + i.qty, 0);
const inCart = id => S.cart.some(i => i.id === id);
const haptic = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); };

function tileHtml(p) {
  const g = stageGain(p);
  if (p.stage) return `<div class="tile"><span class="k">Stage ${p.stage}</span><span>${g && g.dhp > 0 ? `<span class="v">+${g.dhp} л.с.</span><br><span class="s">до ${g.hp} л.с. и ${g.nm} Н·м</span>` : `<span class="s">Прирост посчитаем для вашего авто</span>`}</span></div>`;
  return `<div class="tile">${p.t ? `<span class="word">${p.t}</span>` : `<svg class="ico gl" viewBox="0 0 24 24" aria-hidden="true">${IC[p.g || CATM[p.cat].g] || IC.package}</svg>`}<span class="s">${esc(CATM[p.cat].n)}</span></div>`;
}
function mediaInner(p, v) {
  const src = pimg(p, v);
  return src ? `<img src="${src}" alt="" loading="lazy" referrerpolicy="no-referrer">` : tileHtml(p);
}
/* the fit note only appears when it tells something new: filter off, or the item is not universal */
function fitNote(p) {
  const c = car(); if (!c || universal(p)) return '';
  if (fits(p, c)) return S.onlyFit && S.tab === 'catalog' ? '' : `<span class="fitnote">${ic('check')}Подходит к ${esc(c.short)}</span>`;
  return `<span class="fitnote no">Не для ${esc(c.short)}</span>`;
}
function pcard(p) {
  const fav = S.fav.has(p.id); const src = pimg(p);
  return `<div class="card">
    <button class="media ${src && isContain(p) ? 'contain' : ''}" data-act="product" data-v="${p.id}" aria-label="${esc(p.n)}">
      ${mediaInner(p)}
      ${p.badge ? `<span class="badge ${p.badge === 'Новинка' ? 'new' : ''}">${p.badge}</span>` : ''}
    </button>
    <button class="favbtn ${fav ? 'on' : ''}" data-act="fav" data-v="${p.id}" aria-label="${fav ? 'Убрать из избранного' : 'В избранное'}" aria-pressed="${fav}"><span>${ic('heart')}</span></button>
    <div class="info">
      ${fitNote(p)}
      <button class="name" data-act="product" data-v="${p.id}">${esc(p.n)}</button>
      <div class="pr">
        <div><div class="price">${p.v && p.v.some(x => x.p) ? 'от ' : ''}${rub(minPrice(p))}</div>${p.old ? `<div class="old">${rub(p.old)}</div>` : ''}</div>
        <button class="addbtn ${inCart(p.id) ? 'in' : ''}" data-act="quickadd" data-v="${p.id}" aria-label="${inCart(p.id) ? 'Уже в корзине, открыть корзину' : 'Добавить в корзину'}">${ic(inCart(p.id) ? 'check' : 'plus')}</button>
      </div>
    </div>
  </div>`;
}
function plateHtml(pl) {
  if (!pl) return '';
  return `<span class="plate" aria-label="Госномер ${pl.join(' ')}"><span class="m"><em>${pl[0]}</em>${pl[1]}<em>${pl[2]}</em></span><span class="rg">${pl[3]}<small>RUS<i></i></small></span></span>`;
}

/* dyno chart: stock vs stage curves; the curve shapes are illustrative, the peak values are the ones we verify on the dyno */
function dynoSVG(stockHp, targetHp) {
  const W = 340, H = 150, padL = 4, padR = 46, padT = 14, padB = 22;
  const top = Math.max(stockHp, targetHp) * 1.08;
  const x = r => padL + (r - 1000) / 5500 * (W - padL - padR);
  const y = v => padT + (1 - v / top) * (H - padT - padB);
  const shape = (r, early) => { const t = Math.min(1, (r - 1000) / (early ? 4300 : 4600)); const s = Math.sin(Math.PI / 2 * t) ** 1.25; return r > 5600 ? s * (1 - (r - 5600) / 9000) : s; };
  const val = (hp, r, early) => hp * (0.18 + 0.82 * shape(r, early));
  const path = (hp, early) => { let d = ''; for (let r = 1000; r <= 6500; r += 125) d += (d ? 'L' : 'M') + x(r).toFixed(1) + ' ' + y(val(hp, r, early)).toFixed(1); return d; };
  const area = path(targetHp, true) + `L${x(6500).toFixed(1)} ${y(0)}L${x(1000)} ${y(0)}Z`;
  const pk = (hp, early) => { let best = 0, rr = 1000; for (let r = 1000; r <= 6500; r += 125) { const v = val(hp, r, early); if (v > best) { best = v; rr = r; } } return [x(rr), y(best)]; };
  const [sx, sy] = pk(stockHp, false), [tx, ty] = pk(targetHp, true);
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="${padL}" x2="${W - padR}" y1="${y(top * f)}" y2="${y(top * f)}" stroke="#383e46" stroke-width="1"/>`).join('');
  const ticks = [2000, 4000, 6000].map(r => `<text x="${x(r)}" y="${H - 6}" fill="#a3abb5" font-size="10" text-anchor="middle" font-family="Onest,system-ui">${r / 1000} тыс.</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Мощность по оборотам: сейчас ${stockHp} л.с., после прошивки около ${targetHp} л.с.">
    <defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc53d" stop-opacity=".22"/><stop offset="1" stop-color="#ffc53d" stop-opacity="0"/></linearGradient></defs>
    ${grid}${ticks}
    <text x="${W - padR + 6}" y="${H - 6}" fill="#a3abb5" font-size="10" font-family="Onest,system-ui">об/мин</text>
    <path d="${area}" fill="url(#dg)"/>
    <path d="${path(stockHp, false)}" fill="none" stroke="#a3abb5" stroke-width="2" stroke-dasharray="4 4"/>
    <path class="curve-stage" style="--len:600" d="${path(targetHp, true)}" fill="none" stroke="#ffc53d" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${sx}" cy="${sy}" r="3.5" fill="#a3abb5"/><text x="${W - padR + 6}" y="${sy + 4}" fill="#a3abb5" font-size="12" font-family="Oswald,sans-serif">${stockHp}</text>
    <circle cx="${tx}" cy="${ty}" r="4.5" fill="#ffc53d"/><text x="${W - padR + 6}" y="${ty + 5}" fill="#ffc53d" font-size="15" font-weight="600" font-family="Oswald,sans-serif">${targetHp}</text>
  </svg>`;
}

/* ======================= screens ======================= */
function dynoCard() {
  const c = car();
  if (!c) return `<div class="dyno"><div class="empty-car"><h3>Какая у вас машина?</h3><p>Выберите марку и модификацию: покажем подходящие детали и сколько даст прошивка.</p><button class="btn btn-accent btn-block" data-act="carsheet">${ic('car')}Выбрать автомобиль</button></div></div>`;
  const head = `<button class="car" data-act="carsheet" aria-label="Сменить автомобиль: ${esc(c.title)}">
      <span class="ph">${c.m.img ? `<img src="${IMG}${c.m.img}" alt="">` : ic('car')}</span>
      <span class="t"><b>${esc(c.title)}</b><span>${esc(c.spec)}</span></span>
      <span class="chg">Сменить</span></button>`;
  const g = stageGain(PM['stage' + S.stage], c) || stageGain(PM.stage1, c);
  if (!g || g.dhp <= 0) {
    return `<div class="dyno">${head}<p class="note" style="padding-top:var(--sp-1)">${['ev', 'erev', 'phev'].includes(c.fuel) ? 'Для электромобилей и гибридов прошивку не делаем.' : 'Для этого мотора прошивки пока нет.'} Подберём ходовую, тормоза, детейлинг и защиту кузова.</p>
      <div class="cta" style="padding-top:0"><button class="btn btn-quiet btn-block" data-act="shopactive">Детали для ${esc(c.short)}</button></div></div>`;
  }
  const g1 = stageGain(PM.stage1, c), g2 = stageGain(PM.stage2, c);
  const st = g2 ? S.stage : 1;
  const pack = st === 2 ? ['stage2', 'downpipe', 'intercooler', 'dv'].map(id => PM[id]).filter(p => fits(p)) : [PM.stage1];
  const sum = pack.reduce((a, p) => a + p.p, 0);
  const gs = st === 2 ? g2 : g1;
  return `<div class="dyno">${head}
    <div class="read"><div class="big num">${gs.hp}<small>л.с.</small></div><div class="from">сейчас ${c.d[2]} л.с., ${c.d[3]} Н·м<br><span class="gain">+${gs.dhp} л.с., +${gs.dnm} Н·м</span></div></div>
    <div class="chart">${dynoSVG(c.d[2], gs.hp)}</div>
    <div class="stages" role="tablist" aria-label="Уровень прошивки">
      <button role="tab" aria-selected="${st === 1}" class="${st === 1 ? 'on' : ''}" data-act="stage" data-v="1">Stage 1 <em>+${g1.dhp} л.с.</em></button>
      ${g2 ? `<button role="tab" aria-selected="${st === 2}" class="${st === 2 ? 'on' : ''}" data-act="stage" data-v="2">Stage 2 <em>+${g2.dhp} л.с.</em></button>` : ''}
    </div>
    <div class="cta"><button class="btn btn-accent btn-split" data-act="product" data-v="stage${st}"><span>${st === 2 ? 'Собрать пакет Stage 2' : 'Записаться на Stage 1'}</span><span class="p num">${rub(sum)}</span></button></div>
    <p class="note">${st === 2 ? 'Даунпайп, интеркулер, клапан DV+ и прошивка за один день в боксе. ' : 'Только прошивка, без замены деталей. '}Цифры ориентировочные, итог фиксируем замером на стенде.</p>
  </div>`;
}

function catalogList() {
  const c = car();
  let list = P.filter(p => (S.cat === 'all' || p.cat === S.cat) && (!S.onlyFit || !c || fits(p)));
  if (S.q) {
    const words = S.q.toLowerCase().split(/\s+/).filter(Boolean);
    list = list.filter(p => { const hay = (p.n + ' ' + p.art + ' ' + p.d + ' ' + CATM[p.cat].n).toLowerCase(); return words.every(w => hay.includes(w)); });
  }
  if (S.sort === 'asc') list.sort((a, b) => minPrice(a) - minPrice(b));
  else if (S.sort === 'desc') list.sort((a, b) => minPrice(b) - minPrice(a));
  else list.sort((a, b) => (b.pop || 0) - (a.pop || 0));
  return list;
}

  const list = catalogList(); const n = list.length; const c = car();

}

function slotDays() {
  const names = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб']; const out = []; const d = new Date();
  for (let i = 1; out.length < 6 && i < 10; i++) { const x = new Date(d); x.setDate(d.getDate() + i); if (x.getDay() === 0) continue; out.push({ key: x.toISOString().slice(0, 10), w: names[x.getDay()], n: x.getDate(), m: x.toLocaleString('ru-RU', { month: 'short' }).replace('.', '') }); }
  return out;
}
const TIMES = ['10:00', '12:00', '14:00', '16:00', '18:00'];
function totals() {
  let goods = 0, svc = 0, inst = 0;
  S.cart.forEach(i => { const p = PM[i.id]; const u = unitPrice(p, i.v) * i.qty; if (p.svc) svc += u; else goods += u; if (i.inst && p.inst) inst += p.inst * i.qty; });
  const promo = S.promoOk ? Math.round(goods * 0.10) : 0;
  const deliv = S.delivery === 'cdek' ? 450 : S.delivery === 'courier' ? 690 : 0;
  const pre = goods + svc + inst - promo + deliv;
  const maxBonus = Math.min(S.bonus, Math.floor(pre * 0.2));
  const bonus = S.useBonus ? maxBonus : 0;
  const total = Math.max(0, pre - bonus);
  return { goods, svc, inst, promo, deliv, bonus, maxBonus, total, earn: Math.round(total * 0.05) };
}
const needsSlot = () => S.cart.some(i => (i.inst && PM[i.id].inst) || PM[i.id].svc);

let lastKey = '';
function render() {
  const view = $('#view');

  const fresh = key !== lastKey;
  const keep = fresh ? 0 : view.scrollTop;
  view.innerHTML = S.product ? vProduct() : S.carInfo ? vCarInfo() : ({ home: vHome, catalog: vCatalog, cart: vCart, profile: vProfile })[S.tab]();
  view.scrollTop = keep;
  /* the dyno line draws once when the screen opens, and re-draws only when the stage or car changes */
  if (!fresh && !render.redraw) view.querySelectorAll('.curve-stage').forEach(e => e.style.animation = 'none');
  render.redraw = false; lastKey = key;

  const bottom = $('#bottom');
  if (S.product) {
    const p = PM[S.product]; const price = unitPrice(p, S.pv) * S.pqty + (S.pinst && p.inst ? p.inst * S.pqty : 0);
    const already = S.cart.some(i => i.id === p.id && i.v === S.pv);
    bottom.innerHTML = `<div class="actionbar">

      ${already ? `<button class="btn btn-quiet" style="flex:1" data-act="tab" data-v="cart">${ic('check')}В корзине, перейти</button>` : `<button class="btn btn-accent btn-split" style="flex:1" data-act="addp"><span>${p.svc ? 'Записаться' : 'В корзину'}</span><span class="p num">${rub(price)}</span></button>`}
    </div>`;
  } else if (!S.carInfo && S.tab === 'cart' && S.cart.length) {
    bottom.innerHTML = `<div class="actionbar"><button class="btn btn-accent btn-split" data-act="checkout"><span>Оформить заказ</span><span class="p num">${rub(totals().total)}</span></button></div>`;
  } else bottom.innerHTML = '';

  const sub = !!(S.product || S.carInfo);
  $('#tabbar').hidden = sub;
  const cc = cartCount();
  $('#tabbar').innerHTML = [['home', 'home', 'Главная'], ['catalog', 'grid', 'Каталог'], ['cart', 'cart', 'Корзина'], ['profile', 'user', 'Кабинет']]
    .map(([id, icn, l]) => `<button class="tab" ${S.tab === id && !sub ? 'aria-current="page"' : ''} data-act="tab" data-v="${id}">${ic(icn)}${l}${id === 'cart' && cc ? `<span class="dot" aria-label="${cc} в корзине">${cc}</span>` : ''}</button>`).join('');

  const gal = $('#gal');
  if (gal && $('#gdots')) gal.addEventListener('scroll', () => {
    const i = Math.round(gal.scrollLeft / gal.clientWidth);
    document.querySelectorAll('#gdots i').forEach((d, j) => d.classList.toggle('on', i === j));
  }, { passive: true });
  view.querySelectorAll('img[referrerpolicy]').forEach(im => im.addEventListener('error', () => { const b = im.closest('.media'); const id = b && b.dataset.v; const p = PM[id] || (S.product && PM[S.product]); if (b && p) { b.classList.remove('contain'); b.innerHTML = tileHtml(p); } else im.remove(); }, { once: true }));

  if (tg) { try { sub ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} }
  persist();
}

}
let lastFocus = null;
function sheet(html, label = '') {
  const host = $('#sheet');

    if (!host.innerHTML) lastFocus = document.activeElement;
    host.innerHTML = `<div class="sheet" data-act="closesheet"><div class="panel" data-stop="1" role="dialog" aria-modal="true" aria-label="${esc(label)}" tabindex="-1"><div class="grab"></div>${html}</div></div>`;

  } else {

    if (had && lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (e.target.closest('[data-stop]') && el.classList.contains('sheet')) return;
  if (el.closest('.brief')) sheet('');
  const a = el.dataset.act, v = el.dataset.v, d = +el.dataset.d;
  switch (a) {
    case 'tab': S.tab = v; S.product = null; S.carInfo = null; sheet(''); break;
    case 'product': openProduct(v); break;
    case 'back': if (S.product) S.product = null; else S.carInfo = null; break;
    case 'fav': S.fav.has(v) ? S.fav.delete(v) : S.fav.add(v); haptic(); if ($('#sheet').innerHTML && !S.product) favSheet(); toast(S.fav.has(v) ? 'Добавлено в избранное' : 'Убрано из избранного'); break;
    case 'quickadd': {
      if (inCart(v)) { S.tab = 'cart'; S.product = null; S.carInfo = null; sheet(''); break; }
      const p = PM[v]; if (p.v || p.svc) { openProduct(v); break; }
      S.cart.push({ id: v, v: null, qty: 1, inst: false }); haptic(); toast('Добавлено в корзину'); break; }
    case 'variant': S.pv = v; break;
    case 'pinst': S.pinst = !S.pinst; break;
    case 'pqty': S.pqty = Math.max(1, Math.min(9, S.pqty + d)); break;
    case 'addp': {
      const p = PM[S.product];
      const ex = S.cart.find(i => i.id === p.id && i.v === S.pv);
      if (ex) ex.qty += S.pqty; else S.cart.push({ id: p.id, v: S.pv, qty: p.svc ? 1 : S.pqty, inst: p.svc ? false : S.pinst });
      haptic('medium'); toast(p.svc ? 'Услуга в корзине, время выберете при оформлении' : 'Добавлено в корзину'); break; }
    case 'qty': { const it = S.cart[+v]; it.qty += d; if (it.qty <= 0 || PM[it.id].svc) { S.cart.splice(+v, 1); toast('Удалено из корзины'); } break; }
    case 'inst': S.cart[+v].inst = !S.cart[+v].inst; break;
    case 'clear': S.cart = []; toast('Корзина очищена'); break;
    case 'cat': S.cat = v; S.tab = 'catalog'; S.product = null; S.carInfo = null; sheet(''); break;
    case 'onlyfit': S.onlyFit = !S.onlyFit; break;
    case 'resetfilters': S.onlyFit = false; S.cat = 'all'; S.q = ''; break;
    case 'stage': S.stage = +v; render.redraw = true; break;
    case 'shopactive': S.onlyFit = true; S.cat = 'all'; S.q = ''; S.tab = 'catalog'; break;
    /* car picker */
    case 'carsheet': openPicker(); return;
    case 'pickbrand': S.picker.step = 'model'; S.picker.b = v; sheet(pickerHtml(), 'Выбор автомобиля'); return;
    case 'pickmodel': { const [b, m] = v.split('|'); S.picker.b = b; S.picker.m = m; S.picker.step = 'mod'; sheet(pickerHtml(), 'Выбор автомобиля'); return; }
    case 'pickstep': S.picker.step = v; if (v === 'brand') S.picker.q = ''; sheet(pickerHtml(), 'Выбор автомобиля'); return;
    case 'pickmod': {
      const g = { b: S.picker.b, m: S.picker.m, i: +v };
      let ix = S.garage.findIndex(x => x.b === g.b && x.m === g.m && x.i === g.i);
      if (ix < 0) { S.garage.push(g); ix = S.garage.length - 1; }
      S.active = ix; S.onlyFit = true; render.redraw = true; sheet(''); haptic('medium');
      toast(`${resolveCar(g).title} в гараже, подбор включён`); break; }
    case 'setactive': S.active = +v; toast('Подбор для ' + resolveCar(S.garage[+v]).title); break;
    case 'rmcar': { const t = resolveCar(S.garage[+v]).title; S.garage.splice(+v, 1); if (S.active >= S.garage.length) S.active = Math.max(0, S.garage.length - 1); S.carInfo = null; toast(t + ' удалён из гаража'); break; }
    case 'carinfo': S.carInfo = { ix: +v }; break;
    case 'setmod': S.garage[S.carInfo.ix].i = +v; break;
    case 'shopfor': S.active = +v; S.onlyFit = true; S.cat = 'all'; S.q = ''; S.tab = 'catalog'; S.carInfo = null; break;
    /* cart */
    case 'deliv': S.delivery = v; break;
    case 'day': S.day = v; S.time = null; break;
    case 'time': S.time = v; break;
    case 'promo': {
      S.promo = ($('#promo').value || '').trim().toUpperCase();
      S.promoOk = S.promo === 'GTJ10';
      S.promoMsg = S.promoOk ? 'Промокод применён: минус 10% на детали' : (S.promo ? 'Такого промокода нет. Проверьте написание' : 'Введите промокод');
      break; }
    case 'bonus': S.useBonus = !S.useBonus; break;
    case 'checkout': checkoutSheet(); return;
    case 'pay': el.parentElement.querySelectorAll('button').forEach(b => { b.classList.toggle('on', b === el); b.setAttribute('aria-checked', b === el); }); return;
    case 'gotoorders': sheet(''); S.tab = 'profile'; S.product = null; S.carInfo = null; break;
    /* profile */
    case 'order': S.openOrder = S.openOrder === v ? null : v; break;
    case 'favs': favSheet(); return;
    case 'addresses': addrSheet(); return;
    case 'rmaddr': S.addr.splice(+v, 1); persist(); addrSheet(); break;
    case 'notifsettings': notifSettingsSheet(); return;
    case 'ntoggle': S.notify[v] = !S.notify[v]; persist(); notifSettingsSheet(); break;
    case 'notifs': notifsSheet(); return;
    case 'club': clubSheet(); return;
    case 'editme': editMeSheet(); return;
    case 'reschedule': rescheduleSheet(); return;
    case 'rday': case 'rtime': el.parentElement.querySelectorAll('button').forEach(b => { b.classList.toggle('on', b === el); b.setAttribute('aria-checked', b === el); }); return;
    case 'rconfirm': sheet(''); toast('Запрос на перенос отправлен менеджеру'); return;
    case 'about': aboutSheet(); return;
    case 'manager': if (tg && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(BOT); } return;
    case 'closesheet': sheet(''); return;
    case 'share': {
      const url = BOT + '/shop?startapp=' + S.product;
      try { if (tg && tg.openTelegramLink) { tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(PM[S.product].n)); return; } } catch (err) {}
      try { navigator.clipboard.writeText(url).then(() => toast('Ссылка на товар скопирована'), () => toast(url)); } catch (err) { toast(url); }
      return; }
  }
  render();
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; $('#gridwrap').innerHTML = gridHtml(); }
  if (e.target.id === 'carq') { S.picker.q = e.target.value; refreshPicker(); }
});
document.addEventListener('change', e => { if (e.target.id === 'sort') { S.sort = e.target.value; $('#gridwrap').innerHTML = gridHtml(); } });
document.addEventListener('keydown', e => {
  if (e.target.id === 'q-home' && e.key === 'Enter') { S.q = e.target.value; S.tab = 'catalog'; S.cat = 'all'; render(); }
  if (e.key === 'Escape' && $('#sheet').innerHTML) sheet('');
  /* keep keyboard focus inside an open sheet */
  if (e.key === 'Tab' && $('#sheet').innerHTML) {
    const f = [...document.querySelectorAll('#sheet button, #sheet input, #sheet textarea, #sheet a[href]')].filter(x => !x.disabled);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !document.querySelector('#sheet').contains(document.activeElement))) { e.preventDefault(); first.focus(); }
  }
});

/* ======================= telegram ======================= */
if (tg) {
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#1d2025'); tg.setBackgroundColor && tg.setBackgroundColor('#1d2025');
    tg.setBottomBarColor && tg.setBottomBarColor('#1d2025');
    tg.BackButton.onClick(() => { if (S.product) S.product = null; else S.carInfo = null; render(); });
    const sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
    if (sp && PM[sp]) openProduct(sp);
  } catch (e) {}
  document.getElementById('tgbar').hidden = true;
}
render.redraw = true;
render();
</script>

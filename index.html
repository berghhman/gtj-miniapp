<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0d0e10">
<link rel="icon" href="img/gtj-wordmark.svg" type="image/svg+xml">
<title>GTJ Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column (Telegram webview) — sticky top, scrolling feed, bottom tab bar; on desktop it sits in a frame next to a short brief. */
:root{
  --ink:#0d0e10;        /* app ground: graphite with a cold bias */
  --panel:#16181b;      /* raised surfaces */
  --panel-2:#1e2125;    /* inputs, pressed */
  --line:#272a2f;       /* hairlines */
  --fg:#efebe2;         /* warm off-white text */
  --muted:#8b9097;
  --cream:#ece5d3;      /* primary actions */
  --red:#e0262f;        /* the plate's red line — counts, sale, alerts only */
  --ok:#7fd1a0;
  --warn:#f0b65a;
  --tile:#ecebe7;       /* studio backdrop for product cut-outs */
  --backdrop:#08090a;
  --f-display:"Tektur","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:var(--f-body);
  --r:14px;
  /* one scale for type and corners */
  --fs-xs:12px;--fs-s:14px;--fs-m:16px;--fs-l:20px;--fs-xl:26px;--fs-2xl:32px;
  --r-s:8px;--r-m:14px;--r-l:22px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
[hidden]{display:none!important}
/* behave like an app, not a page: no zoom, no page bounce, no text selection or long-press menus */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img,svg{-webkit-user-drag:none;user-select:none}
body{position:fixed;inset:0;margin:0;background:var(--backdrop);color:var(--fg);font:500 var(--fs-s)/1.45 var(--f-body);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 6px,transparent 6px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.018) 0 6px,transparent 6px 12px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--cream);outline-offset:2px;border-radius:var(--r-s)}
img{display:block;max-width:100%}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ico.filled{fill:currentColor}
.ico.i14{width:14px;height:14px;vertical-align:-2px}

/* ---------- stage ---------- */
.stage{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:56px}
.brief{display:none}
.app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--ink);overflow:hidden}
@media (min-width:640px){
  .stage{padding:24px}
  .app{height:min(900px,100%);border-radius:36px;border:1px solid #2c3036;box-shadow:0 0 0 8px #050506,0 0 0 9px #26292e,0 40px 80px rgba(0,0,0,.6)}
}
@media (min-width:1000px){
  .brief{display:flex;flex-direction:column;gap:22px;width:330px}
  .brief img{width:200px}
  .brief h1{font:700 var(--fs-xl)/1.15 var(--f-display);margin:0;text-wrap:balance}
  .brief p{margin:0;color:var(--muted);max-width:34ch}
  .brief nav{display:flex;flex-direction:column;gap:6px}
  .brief nav button{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);text-align:left;font-weight:600}
  .brief nav button:hover{border-color:#3a3e44}
  .brief nav button span{color:var(--muted)}
}

/* ---------- telegram chrome (only outside Telegram) ---------- */
.tgbar{flex:none;display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 14px;background:#121315;border-bottom:1px solid var(--line);font-size:var(--fs-s)}
.tgbar b{font-weight:700;display:block;text-align:center;line-height:1.1}
.tgbar small{display:block;text-align:center;color:var(--muted);font-size:var(--fs-xs)}
.tgbar .tgx{color:#6ab3f3;font-weight:600;min-width:64px}
.tgbar .tgm{min-width:64px;text-align:right;color:var(--muted);font-size:var(--fs-l);line-height:1}

/* ---------- view ---------- */
.vp{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--ink)}
main{position:relative;z-index:1;height:100%;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--ink);box-shadow:-14px 0 28px rgba(0,0,0,.45)}
main::-webkit-scrollbar{width:0}
main.snap{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
/* compact bar that takes over the title once the big one scrolls away */
.navbar{position:absolute;top:0;left:0;right:0;z-index:4;height:48px;display:flex;align-items:center;justify-content:center;padding:0 64px;background:rgba(13,14,16,.95);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 1px 0 var(--line);font:600 var(--fs-m)/1 var(--f-display);opacity:0;transform:translateY(-8px);transition:opacity .18s,transform .18s;pointer-events:none}
.navbar b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp.far .navbar.on{opacity:1;transform:none}

/* press feedback instead of hover: everything tappable gives way under the finger */
.cat,.btn,.chip,.mycar,.row-card,.mrow,.brand,.modrow,.iconbtn,.addbtn,.favbtn,.work,.gadd,.day,.seg button,.gtile,.hchange,.card,.gcar,.tab,.stepper button,.linkbtn{transition:transform .14s cubic-bezier(.2,.8,.2,1),filter .14s,background-color .14s}
:is(.cat,.btn,.chip,.mycar,.row-card,.mrow,.brand,.modrow,.iconbtn,.addbtn,.favbtn,.gadd,.day,.seg button,.gtile,.hchange):active{transform:scale(.96)}
.card:has(.cbtn:active,.name:active),.work:active{transform:scale(.975)}
.tab:active{transform:scale(.9)}
.stepper button:active{transform:scale(.85)}
:is(.menu>*,.order>button,.citem .inst):active{background:var(--panel-2)}
.btn-cream:active{filter:brightness(.9)}
/* bigger hit areas for small controls */
.addbtn,.stepper button{position:relative}
:is(.favbtn,.addbtn,.iconbtn,.stepper button)::after{content:"";position:absolute;inset:-6px}
/* images fade in over a shimmer instead of popping in */
:is(.media,.work,.mycar .ph,.gcar .ph,.mrow .ph,.hero,.hcar,.pcar,.mini,.pp>.media) img{opacity:0;transition:opacity .3s}
img.ld{opacity:1!important}
:is(.media,.mycar .ph,.gcar .ph,.mrow .ph,.work):has(>img:not(.ld)){background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);background-size:220% 100%;animation:shimmer 1.2s linear infinite}
.media:has(>img:not(.ld)){background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%)}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{margin:0;font:600 var(--fs-l)/1.2 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.sec-h button{display:inline-flex;align-items:center;gap:1px;min-height:32px;margin:-6px -4px -6px 0;color:var(--muted);font-size:var(--fs-s);font-weight:600;white-space:nowrap}
.sec-h button .ico{width:16px;height:16px;stroke-width:2.2}
.eyebrow{font:500 var(--fs-xs)/1.2 var(--f-body);color:var(--muted)}
.mono{font-variant-numeric:tabular-nums;font-size:var(--fs-xs)}
.num{font-variant-numeric:tabular-nums}
.hint{font-size:var(--fs-xs);color:var(--muted)}
.hint.ok{color:var(--ok)}
.hint.err{color:var(--warn)}

/* header */
.top{position:sticky;top:0;z-index:5;margin:0 -16px;padding:12px 16px;background:linear-gradient(var(--ink) 75%,rgba(13,14,16,0));display:flex;flex-direction:column;gap:12px;transition:background-color .2s,box-shadow .2s}
.vp.scrolled .top{background:rgba(13,14,16,.9);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 1px 0 var(--line)}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow img{width:74px;height:auto}
.brandrow .t{flex:1;min-width:0}
.brandrow .t b{display:block;font:600 var(--fs-m)/1.15 var(--f-display)}
.brandrow .t span{font-size:var(--fs-xs);color:var(--muted)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:var(--r-m);display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.iconbtn.glass{background:rgba(13,14,16,.72);backdrop-filter:blur(6px);border-color:rgba(255,255,255,.08)}
.dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-s);background:var(--red);color:#fff;font:700 var(--fs-xs)/16px var(--f-body);text-align:center}

/* my car */
.mycar{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.mycar .ph{width:76px;height:52px;border-radius:var(--r-s);flex:none;overflow:hidden;background:var(--panel-2);display:grid;place-items:center;color:var(--muted)}
.mycar .ph img{width:100%;height:100%;object-fit:cover}
.mycar .t{flex:1;min-width:0}
.mycar b{display:block;font-weight:700;font-size:var(--fs-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mycar span{font-size:var(--fs-xs);color:var(--muted)}
.mycar.empty{border-style:dashed;border-color:#3a3e44}

/* hero */
.hero{position:relative;border-radius:var(--r-l);overflow:hidden;background:#000;border:1px solid var(--line);margin-top:12px}
.hero img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--panel-2)}
.hero .copy{padding:16px;display:flex;flex-direction:column;gap:12px}
.hero .copy .btn-block+.btn-block{margin-top:-4px}
.hcar{position:relative;background:var(--panel-2)}
.hcar img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.hcar.small{border-radius:var(--r-m);overflow:hidden}
.hchange{position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:var(--r-l);background:rgba(13,14,16,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:var(--fs-s);font-weight:700}
.hchange .ico{width:16px;height:16px}
.hero h3{margin:0;font:700 var(--fs-xl)/1.1 var(--f-display);color:#fff;text-wrap:balance}
.hero p{margin:0;color:#c3c0b8;max-width:36ch}
.hero .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px;flex-wrap:wrap}
.hero .tag{position:absolute;top:12px;left:12px;padding:5px 9px;border-radius:var(--r-s);background:var(--red);color:#fff;font:700 var(--fs-xs)/1 var(--f-body);letter-spacing:.08em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:var(--r-m);font-weight:700;font-size:var(--fs-m);white-space:nowrap;text-decoration:none}
.btn-cream{background:var(--cream);color:#121214}
.btn-cream:active{filter:brightness(.92)}
.btn-ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--fg)}
.btn-sm{height:36px;padding:0 14px;font-size:var(--fs-s);border-radius:var(--r-s)}
.btn-block{width:100%}

/* categories */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:var(--r-m);background:var(--panel);border:1px solid var(--line);font-size:var(--fs-xs);font-weight:600;line-height:1.15;text-align:center;min-width:0}
.cat .ci{width:42px;height:42px;border-radius:var(--r-m);display:grid;place-items:center;background:var(--panel-2)}
.cat .cn{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .ico{width:24px;height:24px;color:var(--cream)}
.cat small{color:var(--muted);font-weight:500;font-size:var(--fs-xs);margin-top:-3px}

/* product cards */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll,.chips{scroll-padding-inline:16px}
.hscroll>*{scroll-snap-align:start;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden;text-align:left}
.hscroll .card{width:168px}
.media{position:relative;display:block;width:100%;aspect-ratio:1/1;background:var(--tile);overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover}
.media.contain img{object-fit:contain;padding:8%}
.media .badge{position:absolute;top:8px;left:8px}
.badge{display:inline-block;padding:4px 8px;border-radius:var(--r-s);font:700 var(--fs-xs)/1.1 var(--f-body);background:#111;color:var(--cream)}
.badge.red{background:var(--red);color:#fff}
.favbtn{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(13,14,16,.55);color:#fff;backdrop-filter:blur(6px)}
.favbtn.on{color:var(--red)}
.favbtn.on .ico{fill:currentColor}
.favbtn .ico{width:18px;height:18px}
.card .info{display:flex;flex-direction:column;gap:4px;padding:10px 10px 12px;flex:1}
.fits{font-size:var(--fs-xs);font-weight:600;color:var(--ok);display:flex;align-items:center;gap:4px;min-width:0}
.fits span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fits.no{color:var(--muted)}
.fits.uni{color:var(--muted)}
.fits .ico{width:13px;height:13px;stroke-width:2.4}
.card .name{font-weight:600;font-size:var(--fs-s);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;text-align:left}
.card .pr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.price{font:600 var(--fs-m)/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.old{font-size:var(--fs-xs);color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.addbtn{width:34px;height:34px;border-radius:var(--r-s);display:grid;place-items:center;background:var(--cream);color:#121214;flex:none}
.addbtn.in{background:var(--panel-2);color:var(--cream);border:1px solid #3a3e44}
.addbtn .ico{width:18px;height:18px;stroke-width:2.2}

/* parts are shown by their category icon, never by a photo */
.pic{width:44px;height:44px;border-radius:var(--r-m);display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);color:var(--cream);flex:none}
.pic .ico{width:24px;height:24px}
.pic.lg{width:56px;height:56px;border-radius:var(--r-m)}
.pic.lg .ico{width:30px;height:30px}
.cbtn{display:block;flex:none}
.gainl{font-size:var(--fs-xs);font-weight:700;color:var(--ok)}
.pp2{display:flex;flex-direction:column;gap:3px;min-width:0}
.card{padding:12px;gap:8px}
.ctop{display:flex;align-items:flex-start;gap:6px}
.ctop .badge{margin-top:3px}
.card .favbtn{position:relative;top:auto;right:auto;margin:-4px -6px 0 auto;width:34px;height:34px;background:transparent;color:var(--muted);backdrop-filter:none}
.card .favbtn.on{color:var(--red)}
.card .name{min-height:2.5em}
.card .pr{padding-top:4px}
.plist{border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line);transition:background-color .14s}
.prow:last-child{border-bottom:0}
.prow .t{display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.prow .t b{font-weight:600;font-size:var(--fs-s);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow .r{display:flex;align-items:center;gap:10px}
.prow .pp2{align-items:flex-end;text-align:right}
.prow .price{font-size:var(--fs-m)}
.prow:has(.t:active,.cbtn:active){background:var(--panel-2)}
.phead{display:flex;align-items:center;gap:12px}

/* works */
.work{width:220px;border-radius:var(--r-m);overflow:hidden;background:var(--panel);border:1px solid var(--line);text-align:left;display:block;padding:0}
.work img{width:100%;aspect-ratio:4/3;object-fit:cover}
.work .wt{display:block;padding:10px 12px 12px}
.work b{display:block;font-size:var(--fs-s)}
.work .wt>span{font-size:var(--fs-xs);color:var(--muted)}

/* sections on home: two front doors, four side doors */
.gbig{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gsmall{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gtile{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;min-height:56px;border-radius:var(--r-m);background:var(--panel);border:1px solid var(--line);text-align:left}
.gtile .ci{width:40px;height:40px;border-radius:var(--r-s);display:grid;place-items:center;background:var(--panel-2);color:var(--cream)}
.gtile b{font-weight:600;font-size:var(--fs-s);line-height:1.2;min-width:0}
.gtile .cnt{color:var(--muted);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
.gtile.big{grid-template-columns:1fr;align-items:start;gap:6px;padding:14px;min-height:0}
.gtile.big .ci{width:44px;height:44px;margin-bottom:4px}
.gtile.big b{font:600 var(--fs-m)/1.2 var(--f-display)}
.gtile.big small{color:var(--muted);font-size:var(--fs-xs);line-height:1.35}
.lgroup{display:flex;flex-direction:column;gap:8px}
.lgroup h3{margin:0;font:600 var(--fs-m) var(--f-display)}
.prow .t .ben{font-size:var(--fs-xs);color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcar{position:relative;margin:0 0 4px}
.pcar img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--panel-2)}
.pcar::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(13,14,16,.9))}
.pcar>span{position:absolute;left:16px;right:16px;bottom:12px;z-index:1;display:flex;align-items:center;gap:10px;font-size:var(--fs-s);font-weight:600;color:#fff}
.pbody .lead{margin:0;color:#d6d2ca;font-size:var(--fs-m);line-height:1.45}
.linkbtn{color:var(--cream);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:32px;text-align:left}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:var(--fs-s);line-height:1.4;color:#cbc7bf}
.consent input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--ok)}
.consent .linkbtn{min-height:0;display:inline}
.form{display:flex;flex-direction:column;gap:12px}
.leadtxt{margin:0;padding:12px;border-radius:var(--r-m);background:var(--panel-2);border:1px solid var(--line);font:500 var(--fs-xs)/1.5 var(--f-body);white-space:pre-wrap;text-align:left;user-select:text;-webkit-user-select:text;word-break:break-word}
.mini{width:56px;height:38px;border-radius:var(--r-s);overflow:hidden;flex:none;background:var(--panel-2)}
.mini img{width:100%;height:100%;object-fit:cover}
.menu .mrowx{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.seg.two{grid-template-columns:1fr 1fr}
.gcar .t .spec{font-size:var(--fs-xs);color:var(--muted)}
.chip::after{content:"";position:absolute;inset:-2px 0}
.btn .num{margin-left:auto;padding-left:12px}
.btn-cream:has(.num){justify-content:flex-start}
/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;margin:0;padding:0;overflow:visible}

/* ======================= helpers ======================= */
const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function modSpec(d) { return `${d[0]}, ${d[2]} л.с., ${d[4]}, ${d[5]} привод`; }
const car = () => S.garage[S.active] ? resolveCar(S.garage[S.active]) : null;

function fits(p, c = car()) {
  if (!c) return true;

}

const unitPrice = (p, v) => { const vr = p.v && p.v.find(x => x.id === v); return vr && vr.p ? vr.p : p.p; };

function slotDays() {
  const names = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб']; const out = []; const d = new Date();
  for (let i = 1; out.length < 6 && i < 10; i++) { const x = new Date(d); x.setDate(d.getDate() + i); if (x.getDay() === 0) continue; out.push({ key: `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`, w: names[x.getDay()], n: x.getDate(), m: x.toLocaleString('ru-RU', { month: 'short' }).replace('.', '') }); }
  return out;
}

const delivCost = () => S.needDelivery ? (S.delivery === 'courier' ? 690 : 450) : 0;
function totals() {
  let goods = 0, svc = 0, inst = 0;
  S.cart.forEach(i => { const p = PM[i.id]; const u = unitPrice(p, i.v) * i.qty; if (p.svc) svc += u; else goods += u; if (i.inst && p.inst) inst += p.inst * i.qty; });
  const promo = S.promoOk ? Math.round(goods * 0.10) : 0;
  const deliv = delivCost();
  const total = Math.max(0, goods + svc + inst - promo + deliv);
  return { goods, svc, inst, promo, deliv, total };
}

/* ======================= render ======================= */
const $ = s => document.querySelector(s);
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const TABS = { home: vHome, catalog: vCatalog, cart: vCart, profile: vProfile };
const TAB_TITLE = { home: '', catalog: '', cart: 'Корзина', profile: 'Кабинет' };
const SCROLL = {};          // each screen remembers where you left it, like tabs in a native app
let lastKey = '';
const keyNow = () => S.product ? 'p:' + S.product : S.carInfo ? 'car' : S.tab;
const isSub = k => k.startsWith('p:') || k === 'car';
const EASE = 'cubic-bezier(.2,.8,.2,1)';

function markLoaded(root) { root.querySelectorAll('img').forEach(i => { if (i.complete && i.naturalWidth) i.classList.add('ld'); }); }
function snapOf(html, scrollTop) {
  const s = document.createElement('main');
  s.className = 'snap'; s.setAttribute('aria-hidden', 'true'); s.inert = true;
  if (html instanceof Element) s.innerHTML = html.innerHTML; else s.innerHTML = html;
  s.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  $('#vp').appendChild(s); s.scrollTop = scrollTop || 0; markLoaded(s);
  return s;
}

function render(opt = {}) {
  const view = $('#view');
  const key = keyNow();
  const changed = key !== lastKey;
  let top = view.scrollTop;
  if (changed) { if (lastKey) SCROLL[lastKey] = view.scrollTop; top = isSub(key) ? 0 : (SCROLL[key] || 0); }
  if (render.reset) { top = 0; render.reset = false; }
  let dir = null;
  if (changed && lastKey && !opt.noAnim && !REDUCED) {
    if (isSub(key) && !isSub(lastKey)) dir = 'push';
    else if (!isSub(key) && isSub(lastKey)) dir = 'pop';
    else if (isSub(key) && isSub(lastKey)) dir = 'push';
  }
  const snap = dir ? snapOf(view, view.scrollTop) : null;
  view.innerHTML = S.product ? vProduct() : S.carInfo ? vCarInfo() : TABS[S.tab]();
  lastKey = key;

  const bottom = $('#bottom');
  if (S.product) {
    const p = PM[S.product]; const price = unitPrice(p, S.pv) * S.pqty + (S.pinst && p.inst ? p.inst * S.pqty : 0);
    const already = S.cart.some(i => i.id === p.id && i.v === S.pv);
    bottom.innerHTML = `<div class="actionbar">
      ${p.svc ? '' : `<div class="stepper"><button data-act="pqty" data-d="-1" aria-label="Меньше">${ic('minus')}</button><span>${S.pqty}</span><button data-act="pqty" data-d="1" aria-label="Больше">${ic('plus')}</button></div>`}
      ${already ? `<button class="btn btn-ghost" style="flex:1" data-act="tab" data-v="cart">${ic('check')}В корзине, перейти</button>` : `<button class="btn btn-cream" data-act="addp">${p.svc ? 'Записаться' : 'В корзину'}<span class="num">${rub(price)}</span></button>`}
    </div>`;
  } else if (!S.carInfo && S.tab === 'cart' && S.cart.length) {
    bottom.innerHTML = `<div class="actionbar"><button class="btn btn-cream" data-act="checkout">Оформить заказ<span class="num">${rub(totals().total)}</span></button></div>`;
  } else bottom.innerHTML = '';

  const sub = !!(S.product || S.carInfo);
  $('#tabbar').hidden = sub;
  const cc = cartCount();
  $('#tabbar').innerHTML = [['home', 'home', 'Главная'], ['catalog', 'grid', 'Каталог'], ['cart', 'cart', 'Корзина'], ['profile', 'user', 'Кабинет']]
    .map(([id, icn, l]) => `<button class="tab ${S.tab === id && !sub ? 'on' : ''}" data-act="tab" data-v="${id}" ${S.tab === id && !sub ? 'aria-current="page"' : ''}>${ic(icn)}${l}${id === 'cart' && cc ? `<span class="dot">${cc}</span>` : ''}</button>`).join('');

  view.scrollTop = top;
  markLoaded(view);
  const nav = $('#navbar'); const nt = sub ? '' : TAB_TITLE[S.tab];
  nav.classList.toggle('on', !!nt); $('#navtitle').textContent = nt;
  onScroll();
  if (snap) {
    const o = { duration: 340, easing: EASE };
    if (dir === 'push') {
      view.animate([{ transform: 'translateX(100%)' }, { transform: 'none' }], o);
      snap.animate([{ transform: 'none', filter: 'brightness(1)' }, { transform: 'translateX(-28%)', filter: 'brightness(.55)' }], { ...o, fill: 'forwards' }).onfinish = () => snap.remove();
    } else {
      snap.style.zIndex = 2;
      view.animate([{ transform: 'translateX(-28%)', filter: 'brightness(.55)' }, { transform: 'none', filter: 'brightness(1)' }], o);
      snap.animate([{ transform: 'none' }, { transform: 'translateX(100%)' }], { ...o, fill: 'forwards' }).onfinish = () => snap.remove();
    }
  }

  const gal = $('#gal');
  if (gal && $('#gdots')) gal.addEventListener('scroll', () => {
    const i = Math.round(gal.scrollLeft / gal.clientWidth);
    document.querySelectorAll('#gdots i').forEach((d, j) => d.classList.toggle('on', i === j));
  }, { passive: true });

  syncBack();
  persist();
}

function onScroll() {
  const v = $('#view'), vp = $('#vp'); const st = v.scrollTop;
  vp.classList.toggle('scrolled', st > 2);
  const g = v.querySelector('.pcar, .pp > .media');
  vp.classList.toggle('far', st > (g ? g.offsetHeight - 70 : 56));
}

/* Telegram's own Back button closes whatever is on top: a sheet, then the pushed screen */
const sheetOpen = () => !!document.querySelector('#sheet .sheet:not(.closing)');
function syncBack() {
  if (!tg) return;
  try { (S.product || S.carInfo || sheetOpen()) ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}
function goBack(noAnim) {
  if (sheetOpen()) return sheet('');
  if (S.product) S.product = null; else if (S.carInfo) S.carInfo = null; else return;
  render({ noAnim });
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000);
}

/* bottom sheet: slides up once, swaps content in place, slides down to close (also by dragging) */
let sheetFocus = null;
function sheet(html, opt = {}) {
  const host = $('#sheet');
  const open = host.querySelectorAll('.sheet:not(.closing)');
  const cur = open[open.length - 1];
  if (!html) {
    if (!cur) return;
    cur.classList.add('closing');
    const p = cur.querySelector('.panel');
    if (REDUCED) cur.remove();
    else {
      const from = p.style.transform || 'none';
      p.animate([{ transform: from }, { transform: 'translateY(105%)' }], { duration: 240, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
      cur.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, fill: 'forwards' }).onfinish = () => cur.remove();
    }
    if (open.length === 1 && sheetFocus && document.contains(sheetFocus)) try { sheetFocus.focus({ preventScroll: true }); } catch (e) {}
    syncBack(); return;
  }
  if (cur && !opt.stack) {
    const p = cur.querySelector('.panel');
    const sameTitle = (p.querySelector('h2') || {}).textContent === (/<h2>(.*?)<\/h2>/.exec(html) || [])[1];
    const st = p.scrollTop;
    p.innerHTML = `<div class="grab"></div>${html}`;
    p.scrollTop = sameTitle ? st : 0;
    markLoaded(p); return;
  }
  if (!cur) sheetFocus = document.activeElement;
  host.insertAdjacentHTML('beforeend', `<div class="sheet" data-act="closesheet"><div class="panel" data-stop="1" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`);
  const p = host.lastElementChild.querySelector('.panel'); markLoaded(p);
  const h = p.querySelector('h2'); if (h) { p.setAttribute('aria-label', h.textContent); }
  p.tabIndex = -1; try { p.focus({ preventScroll: true }); } catch (e) {}
  syncBack();
}
const sheetHead = t => `<div class="shead"><h2>${t}</h2><button class="iconbtn" data-act="closesheet" aria-label="Закрыть">${ic('close')}</button></div>`;

function openProduct(id) {
  const p = PM[id]; if (!p) return;
  S.product = id; S.carInfo = null; S.pv = p.v ? p.v[0].id : null; S.pqty = 1; S.pinst = p.inst != null && !p.svc;
  sheet('');
}

const nowDate = () => new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).replace('.', '');
function leadText(x) {
  const lines = [`GTJ: ${x.kind}`];
  if (x.items) lines.push(x.items);
  if (x.interest) lines.push('Интересует: ' + x.interest);
  if (x.car) lines.push('Машина: ' + x.car);
  if (x.slot) lines.push('Запись: ' + x.slot);
  if (x.delivery) lines.push('Получение: ' + x.delivery);
  if (x.total) lines.push('Сумма: ' + rub(x.total));
  if (x.comment) lines.push('Комментарий: ' + x.comment);
  lines.push('Имя: ' + (x.name || '—') + (x.phone ? ', ' + x.phone : '') + (x.username ? ', @' + x.username : ''));
  if (x.src) lines.push('Источник: ' + x.src);
  if (x.ref) lines.push('Пригласил: ' + x.ref);
  return lines.join('\n');
}
async function sendLead(x) {
  Object.assign(x, { car: x.car || carLine(car()), name: S.me.name, phone: S.me.phone, username: tgUser && tgUser.username, src: S.src, ref: S.ref });
  const text = leadText(x);
  goal(x.kind === 'Заказ' ? 'order_sent' : 'lead_sent', { kind: x.kind });
  if (SHOP.leadEndpoint) {
    try {
      const r = await fetch(SHOP.leadEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, lead: x, initData: tg ? tg.initData : '' }) });
      if (r.ok) return { how: 'sent', text };
    } catch (e) {}
  }
  if (SHOP.manager) {
    const url = `https://t.me/${SHOP.manager.replace(/^@/, '')}?text=${encodeURIComponent(text)}`;
    try { tg && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, '_blank', 'noopener'); } catch (e) {}
    return { how: 'chat', text };
  }
  return { how: 'none', text };
}

const openTg = url => { try { tg && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, '_blank', 'noopener'); } catch (e) {} };

/* keep keyboard focus inside an open sheet */
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || !sheetOpen()) return;
  const p = document.querySelector('#sheet .sheet:not(.closing) .panel'); if (!p) return;
  const f = [...p.querySelectorAll('button,a[href],input,textarea,select,[tabindex]:not([tabindex="-1"])')].filter(el => !el.disabled && el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f.at(-1);
  if (!p.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* ======================= events ======================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('.sheet.closing, main.snap')) return;
  const stop = e.target.closest('[data-stop]');
  if (stop && el.dataset.act === 'closesheet' && el.classList.contains('sheet')) return;
  if (el.closest('.brief')) sheet('');
  const a = el.dataset.act, v = el.dataset.v, d = +el.dataset.d;
  if (['tab', 'group', 'variant', 'deliv', 'day', 'time', 'onlyfit', 'pickbrand', 'pickmodel', 'order', 'inst', 'pinst', 'needdeliv', 'interest'].includes(a)) hSel();
  switch (a) {
    case 'tab':
      if (S.tab === v && !S.product && !S.carInfo) { $('#view').scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); return; }
      S.tab = v; S.product = null; S.carInfo = null; sheet(''); break;
    case 'group': S.group = v; S.tab = 'catalog'; S.product = null; S.carInfo = null; SCROLL.catalog = 0; render.reset = true; sheet(''); break;
    case 'product': openProduct(v); goal('product_open', { id: v }); break;
    case 'back': goBack(); return;
    case 'fav': S.fav.has(v) ? S.fav.delete(v) : S.fav.add(v); haptic(); if (sheetOpen() && $('#sheet h2') && $('#sheet h2').textContent === 'Избранное') favSheet(); break;
    case 'quickadd': {
      if (inCart(v)) { S.tab = 'cart'; S.product = null; S.carInfo = null; sheet(''); break; }
      const p = PM[v]; if (p.v || p.svc) { openProduct(v); break; }
      S.cart.push({ id: v, v: null, qty: 1, inst: false }); hNote('success'); toast('Добавлено в корзину'); goal('add_to_cart', { id: v }); break; }
    case 'variant': S.pv = v; break;
    case 'pinst': S.pinst = !S.pinst; break;
    case 'pqty': S.pqty = Math.max(1, Math.min(9, S.pqty + d)); break;
    case 'addp': {
      const p = PM[S.product];
      const ex = S.cart.find(i => i.id === p.id && i.v === S.pv);
      if (ex) ex.qty += S.pqty; else S.cart.push({ id: p.id, v: S.pv, qty: p.svc ? 1 : S.pqty, inst: p.svc ? false : S.pinst });
      hNote('success'); toast(p.svc ? 'Услуга в корзине, время выберете там' : 'Добавлено в корзину'); goal('add_to_cart', { id: p.id }); break; }
    case 'qty': { const it = S.cart[+v]; it.qty += d; if (it.qty <= 0 || PM[it.id].svc) { S.cart.splice(+v, 1); toast('Удалено из корзины'); } break; }
    case 'inst': S.cart[+v].inst = !S.cart[+v].inst; break;
    case 'clear': S.cart = []; toast('Корзина очищена'); break;
    case 'onlyfit': S.onlyFit = !S.onlyFit; break;
    /* car picker */
    case 'carsheet': openPicker(); return;
    case 'pickbrand': S.picker.step = 'model'; S.picker.b = v; sheet(pickerHtml()); return;
    case 'pickmodel': { const [b, m] = v.split('|'); S.picker.b = b; S.picker.m = m; S.picker.step = 'mod'; sheet(pickerHtml()); return; }
    case 'pickstep': S.picker.step = v; sheet(pickerHtml()); return;
    case 'pickmod': {
      const g = { b: S.picker.b, m: S.picker.m, i: +v };
      let ix = S.garage.findIndex(x => x.b === g.b && x.m === g.m && x.i === g.i);
      if (ix < 0) { S.garage.push(g); ix = S.garage.length - 1; }
      S.active = ix; S.onlyFit = true; sheet(''); haptic('medium');
      { const lf = $('#lform'); if (lf) setTimeout(() => leadSheet(lf.dataset.kind, lf.dataset.p || null), 0); } goal('car_selected', { car: g.b + '/' + g.m });
      toast(resolveCar(g).title + ' выбрана, каталог подстроен'); break; }
    case 'setactive': S.active = +v; toast('Подбор для ' + resolveCar(S.garage[+v]).title); break;
    case 'rmcar': { const t = resolveCar(S.garage[+v]).title; S.garage.splice(+v, 1); if (S.active >= S.garage.length) S.active = Math.max(0, S.garage.length - 1); S.carInfo = null; toast(t + ' удалена из гаража'); break; }

    case 'invitecopy': copy(inviteSheet.url, 'Ссылка скопирована'); return;
    /* cart */
    case 'needdeliv': S.needDelivery = !S.needDelivery; if (S.needDelivery && S.delivery === 'pickup') S.delivery = 'cdek'; break;
    case 'deliv': S.delivery = v; break;
    case 'day': S.day = v; S.time = null; break;
    case 'time': S.time = v; break;
    case 'promoopen': S.promoOpen = true; render(); { const i = $('#promo'); i && i.focus(); } return;
    case 'promo': {
      S.promo = ($('#promo').value || '').trim().toUpperCase();
      S.promoOk = S.promo === 'GTJ10';
      S.promoMsg = S.promoOk ? 'Промокод применён: −10% на детали' : (S.promo ? 'Такого промокода нет. Проверьте написание' : 'Введите промокод');
      if (!S.promoOk) hNote('error');
      break; }
    case 'checkout': checkoutSheet(); goal('checkout_open'); return;
    case 'gotoorders': sheet(''); S.tab = 'profile'; S.product = null; S.carInfo = null; break;
    /* profile */
    case 'order': S.openOrder = S.openOrder === v ? null : v; break;
    case 'favs': favSheet(); return;
    case 'addresses': addrSheet(); return;
    case 'rmaddr': S.addr.splice(+v, 1); persist(); addrSheet(); break;
    case 'editme': editMeSheet(); return;
    case 'about': aboutSheet(); return;
    case 'closesheet': sheet(''); return;
    case 'share': {
      const url = BOT + '/shop?startapp=' + S.product;
      if (tg && tg.openTelegramLink) { openTg('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(PM[S.product].n)); return; }
      copy(url, 'Ссылка на товар скопирована'); return; }
  }
  render();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'lform') submitLead(f);
  else if (f.id === 'cform') placeOrder();
  else if (f.id === 'aform') {
    const t = $('#a-t').value.trim() || 'Адрес', a = $('#a-a').value.trim();
    if (a.length < 6) { hNote('error'); $('#aerr').className = 'hint err'; $('#aerr').textContent = 'Укажите город, улицу и дом.'; return; }
    S.addr.unshift({ t, a }); persist(); sheet(''); render(); toast('Адрес сохранён');
  } else if (f.id === 'mform') { S.me = { name: $('#m-name').value.trim(), phone: $('#m-phone').value.trim() }; persist(); sheet(''); render(); toast('Профиль сохранён'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'promo') { e.preventDefault(); document.querySelector('[data-act=promo]').click(); }
  if (e.key === 'Escape' && sheetOpen()) sheet('');
});

/* ======================= gestures ======================= */
(() => {
  const vp = $('#vp'), view = $('#view');
  view.addEventListener('scroll', onScroll, { passive: true });
  // iOS needs a touch listener for :active press states
  document.addEventListener('touchstart', () => {}, { passive: true });
  // images fade in when they arrive
  document.addEventListener('load', e => { if (e.target.tagName === 'IMG') e.target.classList.add('ld'); }, true);

  // no zoom: pinch, double tap, ctrl+wheel
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  let lastEnd = 0;
  document.addEventListener('touchend', e => {
    if (e.timeStamp - lastEnd < 320 && !e.target.closest('button,a,input,textarea,select,label,[data-act],[data-sv]')) e.preventDefault();
    lastEnd = e.timeStamp;
  }, { passive: false });
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

  // swipe from the left edge goes back, the screen underneath follows the finger
  let sw = null;
  vp.addEventListener('touchstart', e => {
    if (!(S.product || S.carInfo) || REDUCED || e.touches.length > 1) return;
    const t = e.touches[0], r = vp.getBoundingClientRect();
    if (t.clientX - r.left > 28) return;
    sw = { x: t.clientX, y: t.clientY, dx: 0, on: false, w: r.width, t0: e.timeStamp };
  }, { passive: true });
  vp.addEventListener('touchmove', e => {
    if (!sw) return;
    const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if (!sw.on) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
      if (dx < 10) return;
      sw.on = true; sw.under = snapOf(TABS[S.tab](), SCROLL[S.tab] || 0);
    }
    e.preventDefault();
    sw.dx = Math.max(0, dx); const k = sw.dx / sw.w;
    view.style.transform = `translateX(${sw.dx}px)`;
    sw.under.style.transform = `translateX(${-28 * (1 - k)}%)`;
    sw.under.style.filter = `brightness(${.55 + .45 * k})`;
  }, { passive: false });
  const end = e => {
    if (!sw) return; const s = sw; sw = null; if (!s.on) return;
    const v = s.dx / Math.max(1, e.timeStamp - s.t0);
    const go = s.dx > s.w * 0.35 || v > 0.6;
    const o = { duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' };
    const from = view.style.transform, uf = { transform: s.under.style.transform, filter: s.under.style.filter };
    view.style.transform = ''; s.under.style.transform = ''; s.under.style.filter = '';
    if (go) {
      const a = view.animate([{ transform: from }, { transform: 'translateX(100%)' }], o);
      s.under.animate([uf, { transform: 'none', filter: 'brightness(1)' }], o);
      a.onfinish = () => { haptic('light'); goBack(true); a.cancel(); s.under.remove(); };
    } else {
      const a = view.animate([{ transform: from }, { transform: 'none' }], o);
      s.under.animate([uf, { transform: 'translateX(-28%)', filter: 'brightness(.55)' }], o).onfinish = () => s.under.remove();
      a.onfinish = () => a.cancel();
    }
  };
  vp.addEventListener('touchend', end); vp.addEventListener('touchcancel', end);

  // drag a bottom sheet down to close it
  let sd = null;
  const host = $('#sheet');
  host.addEventListener('touchstart', e => {
    const p = e.target.closest('.panel'); if (!p || e.touches.length > 1) return;
    if (e.target.closest('input,textarea,select,.hscroll,.chips')) return;
    if (p.scrollTop > 0 && !e.target.closest('.grab,.shead')) return;
    sd = { p, y: e.touches[0].clientY, x: e.touches[0].clientX, dy: 0, on: false, t0: e.timeStamp };
  }, { passive: true });
  host.addEventListener('touchmove', e => {
    if (!sd) return;
    const dy = e.touches[0].clientY - sd.y, dx = e.touches[0].clientX - sd.x;
    if (!sd.on) { if (dy > 8 && dy > Math.abs(dx)) sd.on = true; else { if (Math.abs(dx) > 8 || dy < -8) sd = null; return; } }
    e.preventDefault();
    sd.dy = Math.max(0, dy - 8);
    sd.p.style.transform = `translateY(${sd.dy}px)`;
    sd.p.parentElement.style.backgroundColor = `rgba(0,0,0,${.55 * Math.max(0, 1 - sd.dy / sd.p.offsetHeight)})`;
  }, { passive: false });
  const sEnd = e => {
    if (!sd) return; const s = sd; sd = null; if (!s.on) return;
    const v = s.dy / Math.max(1, e.timeStamp - s.t0);
    if (s.dy > 110 || v > 0.7) { sheet(''); return; }
    s.p.animate([{ transform: s.p.style.transform }, { transform: 'none' }], { duration: 200, easing: 'cubic-bezier(.2,.8,.2,1)' });
    s.p.style.transform = ''; s.p.parentElement.style.backgroundColor = '';
  };
  host.addEventListener('touchend', sEnd); host.addEventListener('touchcancel', sEnd);
})();

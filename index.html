<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<link rel="icon" href="img/gtj-logo.svg" type="image/svg+xml">
<title>GTJ Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column (Telegram webview) — sticky top, scrolling feed, bottom tab bar; on desktop it sits in a frame next to a short brief. */
:root{
  --ink:#0d0e10;        /* app ground: graphite with a cold bias */
  --panel:#16181b;      /* raised surfaces */
  --panel-2:#1e2125;    /* inputs, pressed */
  --line:#272a2f;       /* hairlines */
  --fg:#efebe2;         /* text: warm off-white, echoes the sticker rim */
  --muted:#8b9097;
  --cream:#ece5d3;      /* brand cream (logo outline) — primary actions */
  --red:#e0262f;        /* brand red lip — counts, sale, alerts only */
  --ok:#7fd1a0;
  --warn:#f0b65a;
  --tile:#ecebe7;       /* studio backdrop for product cut-outs */
  --backdrop:#08090a;
  --f-display:"Tektur","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--backdrop);color:var(--fg);font:500 14px/1.45 var(--f-body);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 6px,transparent 6px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.018) 0 6px,transparent 6px 12px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cream);outline-offset:2px;border-radius:8px}
img{display:block;max-width:100%}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- stage ---------- */
.stage{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:56px}
.brief{display:none}
.app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--ink);overflow:hidden}
@media (min-width:640px){
  .stage{padding:24px}
  .app{height:min(900px,100%);border-radius:36px;border:1px solid #2c3036;box-shadow:0 0 0 8px #050506,0 0 0 9px #26292e,0 40px 80px rgba(0,0,0,.6)}
}
@media (min-width:1000px){
  .brief{display:flex;flex-direction:column;gap:22px;width:330px}
  .brief img{width:240px}
  .brief h1{font:700 30px/1.1 var(--f-display);margin:0;text-wrap:balance}
  .brief p{margin:0;color:var(--muted);max-width:34ch}
  .brief nav{display:flex;flex-direction:column;gap:6px}
  .brief nav button{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:left;font-weight:600}
  .brief nav button:hover{border-color:#3a3e44}
  .brief nav button span{color:var(--muted);font:500 12px var(--f-mono)}
}

/* ---------- telegram chrome (shown only outside Telegram) ---------- */
.tgbar{flex:none;display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 14px;background:#121315;border-bottom:1px solid var(--line);font-size:14px}
.tgbar b{font-weight:700;display:block;text-align:center;line-height:1.1}
.tgbar small{display:block;text-align:center;color:var(--muted);font-size:11px}
.tgbar .tgx{color:#6ab3f3;font-weight:600;min-width:64px}
.tgbar .tgm{min-width:64px;text-align:right;color:var(--muted);font-size:20px;line-height:1}

/* ---------- view ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;scroll-behavior:smooth;overscroll-behavior:contain}
main::-webkit-scrollbar{width:0}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{margin:0;font:600 18px/1.2 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.sec-h button{color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:0;z-index:5;margin:0 -16px;padding:12px 16px 12px;background:linear-gradient(var(--ink) 75%,rgba(13,14,16,0));display:flex;flex-direction:column;gap:12px}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow img{width:58px;height:auto}
.brandrow .t{flex:1;min-width:0}
.brandrow .t b{display:block;font:700 19px/1 var(--f-display);letter-spacing:.04em}
.brandrow .t span{font-size:12px;color:var(--muted)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font:700 10px/16px var(--f-body);text-align:center}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg)}
.search input::placeholder{color:var(--muted)}

/* my car */
.mycar{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.mycar img{width:76px;height:52px;object-fit:cover;border-radius:9px}
.mycar .t{flex:1;min-width:0}
.mycar b{display:block;font-weight:700;font-size:15px}
.mycar span{font-size:12px;color:var(--muted)}

/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line);margin-top:4px}
.hero img{width:100%;aspect-ratio:835/265;object-fit:cover}
.hero .copy{padding:10px 16px 16px;display:flex;flex-direction:column;gap:8px}
.hero h3{margin:0;font:700 34px/1 var(--f-display);letter-spacing:.01em;background:linear-gradient(180deg,#fff 0%,#c9ced5 45%,#737a83 62%,#e6e9ec 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:#c3c0b8;max-width:36ch}
.hero .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px}
.hero .tag{position:absolute;top:12px;left:12px;padding:5px 9px;border-radius:7px;background:var(--red);color:#fff;font:700 11px/1 var(--f-body);letter-spacing:.08em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;white-space:nowrap}
.btn-cream{background:var(--cream);color:#121214}
.btn-cream:active{filter:brightness(.92)}
.btn-ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--fg)}
.btn-sm{height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn-block{width:100%}

/* categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:11.5px;font-weight:600;line-height:1.15;text-align:center}
.cat .ico{width:28px;height:28px;stroke-width:1.5;color:var(--cream)}

/* product cards */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden;text-align:left}
.hscroll .card{width:168px}
.media{position:relative;aspect-ratio:1/1;background:var(--tile);overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover}
.media.contain img{object-fit:contain;padding:8%}
.media .badge{position:absolute;top:8px;left:8px}
.badge{display:inline-block;padding:4px 7px;border-radius:6px;font:700 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:#111;color:var(--cream)}
.badge.red{background:var(--red);color:#fff}
.favbtn{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(13,14,16,.55);color:#fff;backdrop-filter:blur(6px)}
.favbtn.on{color:var(--red)}
.favbtn.on .ico{fill:currentColor}
.favbtn .ico{width:18px;height:18px}
.card .info{display:flex;flex-direction:column;gap:4px;padding:10px 10px 12px;flex:1}
.card .fits{font-size:11px;font-weight:600;color:var(--ok);display:flex;align-items:center;gap:4px}
.card .fits.no{color:var(--muted)}
.card .fits .ico{width:13px;height:13px;stroke-width:2.4}
.card .name{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card .pr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.price{font:600 16px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.old{font-size:12px;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.addbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--cream);color:#121214;flex:none}
.addbtn.in{background:var(--panel-2);color:var(--cream);border:1px solid #3a3e44}
.addbtn .ico{width:18px;height:18px;stroke-width:2.2}

/* service tile (no photo) */
.svc{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:34px 12px 12px;color:var(--fg);
  background:radial-gradient(120% 90% at 100% 0%,rgba(224,38,47,.28),transparent 55%),repeating-linear-gradient(45deg,#17191c 0 5px,#1d2024 5px 10px)}
.svc .k{font:700 22px/1 var(--f-display);letter-spacing:.03em}
.svc .v{font:700 30px/1 var(--f-display);color:var(--cream)}
.svc .s{font-size:11px;color:var(--muted)}

/* works */
.work{width:220px;border-radius:var(--r);overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.work img{width:100%;aspect-ratio:4/3;object-fit:cover}
.work div{padding:9px 11px 11px}
.work b{display:block;font-size:13px}
.work span{font-size:11.5px;color:var(--muted)}

.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.perk{padding:12px 10px;border-radius:12px;border:1px dashed #33373d;font-size:12px;line-height:1.3;color:var(--muted)}
.perk b{display:block;color:var(--fg);font:600 13px/1.2 var(--f-display);margin-bottom:4px}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--cream);color:#121214;border-color:var(--cream)}
.chip .ico{width:14px;height:14px;stroke-width:2.4}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}
.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:34px;padding:0 10px}

/* product page */
.pp{margin:0 -16px}
.pnav{position:sticky;top:0;z-index:6;height:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px 0}
.iconbtn.glass{background:rgba(13,14,16,.72);backdrop-filter:blur(6px);border-color:rgba(255,255,255,.08)}
.ico.filled{fill:currentColor}
.ico.i14{width:14px;height:14px;vertical-align:-2px}
button.media{display:block;width:100%;border-radius:0}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--tile)}
.gal::-webkit-scrollbar{display:none}
.gal .media{flex:none;width:100%;scroll-snap-align:center;aspect-ratio:1/1}
.gdots{display:flex;gap:5px;justify-content:center;margin-top:-22px;position:relative;z-index:1}
.gdots i{width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.25)}
.gdots i.on{width:18px;background:#121214}
.pbody{padding:16px;display:flex;flex-direction:column;gap:14px}
.pbody h1{margin:0;font:600 23px/1.15 var(--f-display);text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:12.5px}
.stock{color:var(--ok);font-weight:600}
.fitbar{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-size:13px;font-weight:600;border:1px solid}
.fitbar.ok{color:var(--ok);border-color:rgba(127,209,160,.3);background:rgba(127,209,160,.07)}
.fitbar.no{color:var(--warn);border-color:rgba(240,182,90,.3);background:rgba(240,182,90,.07)}
.pricebig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pricebig .price{font-size:28px}
.bonus{font-size:12px;font-weight:700;color:var(--cream);padding:4px 8px;border-radius:7px;background:rgba(236,229,211,.1)}
.opt{display:flex;flex-direction:column;gap:8px}
.opt .lbl{font-size:12px;color:var(--muted);font-weight:600}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
.row-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.row-card .t{flex:1;min-width:0}
.row-card b{display:block;font-size:14px}
.row-card span{font-size:12px;color:var(--muted)}
.row-card>.ico{color:var(--cream)}
.toggle{position:relative;width:46px;height:28px;border-radius:14px;background:#33373d;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--ok)}
.toggle.on::after{transform:translateX(18px)}
.desc{margin:0;color:#cbc7bf;line-height:1.55;max-width:60ch}
.specs{width:100%;border-collapse:collapse;font-size:13px}
.specs td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.specs td:first-child{color:var(--muted);width:44%;padding-right:10px}
.actionbar{flex:none;display:flex;gap:10px;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:rgba(13,14,16,.96)}
.actionbar .btn-cream{flex:1}
.stepper{display:inline-flex;align-items:center;height:46px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.stepper button{width:38px;height:100%;display:grid;place-items:center}
.stepper span{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.stepper.sm{height:34px;border-radius:10px}
.stepper.sm button{width:32px}
.stepper .ico{width:16px;height:16px;stroke-width:2.4}

/* page title */
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px}
.ptitle h1{margin:0;font:600 26px/1.1 var(--f-display)}
.ptitle button{color:var(--muted);font-size:13px;font-weight:600}

/* cart */
.citem{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.citem .media{border-radius:10px;aspect-ratio:1/1}
.citem .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.citem .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.citem .vr{font-size:12px;color:var(--muted)}
.citem .bot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.citem .inst{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px dashed #30343a;font-size:12.5px;text-align:left;width:100%}
.citem .inst .t2{flex:1}
.citem .inst .ico{width:18px;height:18px;color:var(--cream)}
.check{width:22px;height:22px;border-radius:7px;border:1.5px solid #4a4f56;display:grid;place-items:center;flex:none}
.check.on{background:var(--ok);border-color:var(--ok);color:#0d0e10}
.check .ico{width:14px;height:14px;stroke-width:3}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.seg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:9px;font-size:12.5px;font-weight:700}
.seg button small{font-weight:500;color:var(--muted);font-size:11px}
.seg button.on{background:var(--panel-2);box-shadow:inset 0 0 0 1px #3d4148}
.seg button.on small{color:var(--cream)}
.slots{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.day{flex:none;width:52px;height:58px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day small{font-size:11px;color:var(--muted)}
.day b{font:600 18px/1 var(--f-display)}
.day.on{background:var(--cream);color:#121214;border-color:var(--cream)}
.day.on small{color:#4a4740}
.time:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.promo{display:flex;gap:8px}
.promo input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);text-transform:uppercase;font-family:var(--f-mono);letter-spacing:.06em}
.hint{font-size:12px;color:var(--muted)}
.hint.ok{color:var(--ok)}
.hint.err{color:var(--warn)}
.sum{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.sum .l{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:#cbc7bf;font-variant-numeric:tabular-nums}
.sum .l.minus span:last-child{color:var(--ok)}
.sum .tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:2px;border-top:1px solid var(--line)}
.sum .tot b{font:600 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:48px 12px}
.empty img{width:180px;opacity:.9;filter:grayscale(.3)}
.empty h3{margin:0;font:600 20px var(--f-display)}
.empty p{margin:0;color:var(--muted);max-width:30ch}

/* profile */
.prof{display:flex;align-items:center;gap:14px;padding-top:16px}
.ava{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font:700 22px var(--f-display);color:#121214;background:linear-gradient(160deg,#fff,#b9bec6 45%,#6b727b 60%,#e3e6ea)}
.prof b{display:block;font:600 20px/1.15 var(--f-display)}
.prof span{font-size:12.5px;color:var(--muted)}
.club{position:relative;border-radius:18px;padding:18px;overflow:hidden;color:#141416;
  background:linear-gradient(115deg,#d9dde2 0%,#f7f8f9 22%,#a9afb7 46%,#e6e9ec 64%,#9aa0a8 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.club::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px);pointer-events:none}
.club .top2{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.club .lvl{font:700 12px/1 var(--f-body);letter-spacing:.2em}
.club .nm{font:700 15px/1 var(--f-display);letter-spacing:.12em;margin-top:6px}
.club img{width:84px;margin:-6px -4px 0 0}
.club .bal{position:relative;display:flex;align-items:baseline;gap:8px;margin-top:14px}
.club .bal b{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}

.plate .rg small{display:flex;align-items:center;gap:2px;font-size:6px;letter-spacing:.05em}

.appt .d b{font:700 24px/1 var(--f-display)}
.appt .d small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

.appt .t b{font-size:14.5px}
.appt .t span{font-size:12.5px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;font-weight:700}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.pill.ship{color:#7db7ff;background:rgba(125,183,255,.1)}
.pill.wait{color:var(--warn);background:rgba(240,182,90,.1)}
.pill.new{color:var(--cream);background:rgba(236,229,211,.1)}
.tl{list-style:none;margin:0;padding:4px 14px 14px 14px;display:flex;flex-direction:column}
.tl li{position:relative;padding:0 0 12px 22px;font-size:12.5px;color:var(--muted)}
.tl li::before{content:"";position:absolute;left:4px;top:5px;width:8px;height:8px;border-radius:50%;background:#3a3e44}
.tl li::after{content:"";position:absolute;left:7.5px;top:15px;bottom:-3px;width:1px;background:#3a3e44}

.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
.tab.on{color:var(--cream)}

.sheet .grab{width:40px;height:5px;border-radius:3px;background:#3a3e44;align-self:center}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600}

.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}

.toast{position:absolute;left:50%;bottom:150px;z-index:30;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:11px 16px;border-radius:12px;background:var(--cream);color:#121214;font-weight:700;font-size:13px;white-space:nowrap;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.4)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function slotDays(){
  const names=['Вс','Пн','Вт','Ср','Чт','Пт','Сб']; const out=[]; const d=new Date();
  for(let i=1;i<=7;i++){ const x=new Date(d); x.setDate(d.getDate()+i); if(x.getDay()===0) continue; out.push({key:x.toISOString().slice(0,10), w:names[x.getDay()], n:x.getDate(), m:x.toLocaleString('ru-RU',{month:'short'}).replace('.','')}); }
  return out.slice(0,6);
}
const TIMES=['10:00','12:00','14:00','16:00','18:00'];
function totals(){
  let goods=0, svc=0, inst=0;
  S.cart.forEach(i=>{ const p=PM[i.id]; const u=unitPrice(p,i.v)*i.qty; if(p.service) svc+=u; else goods+=u; if(i.inst && p.inst) inst+=p.inst*i.qty; });
  const promo = S.promoOk ? Math.round(goods*0.10) : 0;
  const deliv = S.delivery==='cdek' ? 450 : S.delivery==='courier' ? 690 : 0;
  const pre = goods+svc+inst-promo+deliv;
  const maxBonus = Math.min(S.bonus, Math.floor(pre*0.2));
  const bonus = S.useBonus ? maxBonus : 0;
  const total = Math.max(0, pre-bonus);
  return {goods, svc, inst, promo, deliv, bonus, maxBonus, total, earn:Math.round(total*0.05)};
}

/* ======================= render ======================= */
const $ = s => document.querySelector(s);
let lastKey = '';
function render(){
  const view = $('#view');
  const key = S.product ? 'p:'+S.product : S.tab;
  const keep = key===lastKey ? view.scrollTop : 0;
  view.innerHTML = S.product ? vProduct() : ({home:vHome, catalog:vCatalog, cart:vCart, profile:vProfile})[S.tab]();
  view.scrollTop = keep; lastKey = key;

  // bottom bars
  const bottom = $('#bottom');
  if (S.product){
    const p = PM[S.product]; const price = unitPrice(p,S.pv)*S.pqty + (S.pinst&&p.inst?p.inst*S.pqty:0);
    const already = S.cart.some(i=>i.id===p.id && i.v===S.pv);
    bottom.innerHTML = `<div class="actionbar">
      ${p.service?'':`<div class="stepper"><button data-act="pqty" data-d="-1" aria-label="Меньше">${ic('minus')}</button><span>${S.pqty}</span><button data-act="pqty" data-d="1" aria-label="Больше">${ic('plus')}</button></div>`}
      ${already?`<button class="btn btn-ghost" style="flex:1" data-act="tab" data-v="cart">${ic('check')}В корзине · перейти</button>`:`<button class="btn btn-cream" data-act="addp">${p.service?'Записаться':'В корзину'} · <span class="num">${rub(price)}</span></button>`}
    </div>`;
  } else if (S.tab==='cart' && S.cart.length){
    const t = totals();
    bottom.innerHTML = `<div class="actionbar"><button class="btn btn-cream" data-act="checkout">Оформить заказ · <span class="num">${rub(t.total)}</span></button></div>`;
  } else bottom.innerHTML = '';

  $('#tabbar').hidden = !!S.product;
  const cc = cartCount();
  $('#tabbar').innerHTML = [['home','home','Главная'],['catalog','grid','Каталог'],['cart','cart','Корзина'],['profile','user','Кабинет']]
    .map(([id,icn,l])=>`<button class="tab ${S.tab===id&&!S.product?'on':''}" data-act="tab" data-v="${id}">${ic(icn)}${l}${id==='cart'&&cc?`<span class="dot">${cc}</span>`:''}</button>`).join('');

  // gallery dots
  const gal = $('#gal');
  if (gal && $('#gdots')) gal.addEventListener('scroll', () => {
    const i = Math.round(gal.scrollLeft / gal.clientWidth);
    document.querySelectorAll('#gdots i').forEach((d,j)=>d.classList.toggle('on', i===j));
  }, {passive:true});

  if (tg){ try { S.product ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){} }
  persist();
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}
function sheet(html){
  $('#sheet').innerHTML = html ? `<div class="sheet" data-act="closesheet"><div class="panel" data-stop="1"><div class="grab"></div>${html}</div></div>` : '';
}
function carSheet(){
  sheet(`<h2>Выберите автомобиль</h2>
    <div class="carlist">${CARS.map(c=>`<button class="row-card ${c.id===S.car?'on':''}" data-act="car" data-v="${c.id}">
      ${c.img?`<img src="${IMG}${c.img}" alt="">`:`<div style="width:72px;height:46px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;flex:none">${ic('car')}</div>`}
      <div class="t"><b>${c.name}</b><span>${c.eng}</span></div>${c.id===S.car?ic('check'):''}</button>`).join('')}</div>
    <div class="opt"><span class="lbl">Другие марки — подбор через менеджера</span><div class="chips" style="margin:0;padding:0;flex-wrap:wrap">${OTHER.map(o=>`<button class="chip" data-act="toast" data-v="Подберём детали для ${o} в чате">${o}</button>`).join('')}</div></div>`);
}
function checkoutSheet(){
  const t = totals();
  if (needsSlot() && !S.time){ toast('Выберите время записи в бокс'); const el=document.querySelector('.slots'); el && el.scrollIntoView({block:'center'}); return; }
  const name = tgUser ? tgUser.first_name : 'Дмитрий';
  sheet(`<h2>Оформление</h2>
    <form id="cform" style="display:flex;flex-direction:column;gap:12px" novalidate>
      <div class="field"><label for="f-name">Имя</label><input id="f-name" value="${name}" autocomplete="name"></div>
      <div class="field"><label for="f-phone">Телефон</label><input id="f-phone" value="+7 921 555-23-88" inputmode="tel" autocomplete="tel"></div>
      <div class="field"><label for="f-com">Комментарий</label><textarea id="f-com" placeholder="Например: позвонить за час до установки"></textarea></div>
      <div class="opt"><span class="lbl">Оплата</span>
        <div class="seg" id="pay"><button type="button" class="on" data-act="pay">${ic('card')}Картой<small>онлайн</small></button><button type="button" data-act="pay">${ic('chip')}СБП<small>по QR</small></button><button type="button" data-act="pay">${ic('store')}При получении<small>в боксе</small></button></div></div>
      <div class="sum" style="background:var(--panel-2)">
        ${needsSlot()?`<div class="l"><span>Запись в бокс</span><span>${new Date(S.day).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}, ${S.time}</span></div>`:''}
        <div class="l"><span>Получение</span><span>${{pickup:'Самовывоз',cdek:'СДЭК',courier:'Курьер'}[S.delivery]}</span></div>
        <div class="tot"><span>К оплате</span><b>${rub(t.total)}</b></div>
      </div>
      <button class="btn btn-cream btn-block" type="submit">Подтвердить заказ</button>
    </form>`);
  $('#cform').addEventListener('submit', e => { e.preventDefault(); placeOrder(); });
}
function placeOrder(){
  const t = totals();
  const id = 'GTJ-' + (2472 + S.orders.filter(o=>o.st==='new').length);
  const names = S.cart.map(i=>PM[i.id].name.split(',')[0]).join(', ');
  S.orders.unshift({id, date:'сегодня', items:names, sum:t.total, st:'new', stText:'Оформлен', step:0});
  S.bonus = S.bonus - t.bonus + t.earn;
  S.cart = []; S.useBonus=false; S.promoOk=false; S.promo=''; S.promoMsg=''; S.time=null; S.openOrder=id;
  haptic('medium');
  sheet(`<div class="success"><div class="ok">${ic('check')}</div><h2>Заказ ${id} оформлен</h2>
    <p>Менеджер GTJ подтвердит детали в этом чате. Начислим +${t.earn.toLocaleString('ru-RU')} бонусов после получения.</p>
    <button class="btn btn-cream btn-block" data-act="gotoorders">Мои заказы</button></div>`);
  render();
}

/* ======================= events ======================= */
document.addEventListener('click', e => {
  const stop = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (stop && el.dataset.act==='closesheet') return;
  if (el.closest('.brief')) { sheet(''); }
  const a = el.dataset.act, v = el.dataset.v, d = +el.dataset.d;
  switch(a){
    case 'tab': S.tab=v; S.product=null; sheet(''); break;
    case 'product': {
      const p = PM[v]; S.product=v; S.pv = p.variants ? p.variants[0].id : null; S.pqty=1; S.pinst=!!p.inst; sheet(''); break; }
    case 'back': S.product=null; break;
    case 'fav': S.fav.has(v)?S.fav.delete(v):S.fav.add(v); haptic(); break;
    case 'quickadd': {
      if (inCart(v)) { S.tab='cart'; S.product=null; break; }
      const p = PM[v]; if (p.variants || p.service) { S.product=v; S.pv=p.variants?p.variants[0].id:null; S.pqty=1; S.pinst=!!p.inst; break; }
      S.cart.push({id:v, v:null, qty:1, inst:false}); haptic(); toast('Добавлено в корзину'); break; }
    case 'variant': S.pv=v; break;
    case 'pinst': S.pinst=!S.pinst; break;
    case 'pqty': S.pqty=Math.max(1, Math.min(9, S.pqty+d)); break;
    case 'addp': {
      const p = PM[S.product];
      const ex = S.cart.find(i=>i.id===p.id && i.v===S.pv);
      if (ex) ex.qty+=S.pqty; else S.cart.push({id:p.id, v:S.pv, qty:p.service?1:S.pqty, inst:p.service?false:S.pinst});
      haptic('medium'); toast(p.service?'Услуга добавлена, время выберете в корзине':'Добавлено в корзину'); break; }
    case 'qty': { const it=S.cart[+v]; it.qty+=d; if(it.qty<=0) S.cart.splice(+v,1); break; }
    case 'inst': S.cart[+v].inst=!S.cart[+v].inst; break;
    case 'clear': S.cart=[]; break;
    case 'cat': S.cat=v; S.tab='catalog'; S.product=null; break;
    case 'onlyfit': S.onlyFit=!S.onlyFit; break;
    case 'resetfilters': S.onlyFit=false; S.cat='all'; S.q=''; break;
    case 'carsheet': carSheet(); return;
    case 'car': S.car=v; S.onlyFit=true; sheet(''); toast('Подбор для '+CARS.find(c=>c.id===v).name); break;
    case 'deliv': S.delivery=v; break;
    case 'day': S.day=v; S.time=null; break;
    case 'time': S.time=v; break;
    case 'promo': {
      S.promo = ($('#promo').value||'').trim().toUpperCase();
      S.promoOk = S.promo==='GTJ10';
      S.promoMsg = S.promoOk ? 'Промокод применён: −10% на детали' : (S.promo ? 'Такого промокода нет. Проверьте написание' : 'Введите промокод');
      break; }
    case 'bonus': S.useBonus=!S.useBonus; break;
    case 'checkout': checkoutSheet(); return;
    case 'pay': el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===el)); return;
    case 'closesheet': sheet(''); return;
    case 'gotoorders': sheet(''); S.tab='profile'; S.product=null; break;
    case 'order': S.openOrder = S.openOrder===v ? null : v; break;
    case 'notify': S.notify=!S.notify; break;
    case 'favs': { const f=P.filter(p=>S.fav.has(p.id)); sheet(`<h2>Избранное</h2>${f.length?`<div class="grid">${f.map(pcard).join('')}</div>`:'<p class="hint">Отмечайте товары сердечком, они появятся здесь.</p>'}`); return; }
    case 'share': toast('Ссылка на товар скопирована'); try{ navigator.clipboard.writeText('https://t.me/GTJdetailing_bot?startapp='+S.product).catch(()=>{}); }catch(e){} return;
    case 'toast': toast(v); return;
  }
  render();
});
document.addEventListener('input', e => {
  if (e.target.id==='q'){ S.q=e.target.value; $('#gridwrap').innerHTML = gridHtml(); }
});
document.addEventListener('change', e => {
  if (e.target.id==='sort'){ S.sort=e.target.value; $('#gridwrap').innerHTML = gridHtml(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id==='q-home' && e.key==='Enter'){ S.q=e.target.value; S.tab='catalog'; S.cat='all'; render(); }
  if (e.key==='Escape' && $('#sheet').innerHTML){ sheet(''); }
});

/* ======================= telegram ======================= */
if (tg){
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#0d0e10'); tg.setBackgroundColor && tg.setBackgroundColor('#0d0e10');
    tg.BackButton.onClick(()=>{ S.product=null; render(); });
  } catch(e){}
  document.getElementById('tgbar').hidden = true;
}
render();
</script>
